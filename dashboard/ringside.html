    function taskStateText(kind){return({pass:"passed",fail:"failed",working:"working",retry:"retrying",waiting:"waiting"})[kind]||"waiting"}
    function taskIsRunning(task){return["working","retry"].includes(taskKind(task))}
    function attemptVerdict(record){const verdict=String(record?.verdict||"").toUpperCase();if(verdict==="PASS")return"pass";if(verdict==="FAIL"||numberOrZero(record?.check_returncode)!==0||numberOrZero(record?.worker_returncode)!==0||record?.worker_timed_out)return"fail";return record?.duration_ms==null?"working":"waiting"}
    function integrationVerdict(run){const status=String(run?.integration?.status||"").toLowerCase();return["pass","fail","skipped"].includes(status)?{status}:null}
    function laneCause(task){const records=Array.isArray(task?.attempt_records)?task.attempt_records:[];const last=records.at(-1)||{};return String(last.check_output_excerpt||task?.check_output_tail||task?.worker_error||"").trim()}
    function taskActivity(task){return taskStateText(taskKind(task))}
    function appendSystemStates(parent){if(!state.runError&&!state.libraryError&&!state.modelsError)return;const box=document.createElement("div");box.className="system-region";const bar=document.createElement("div");bar.className="system-bar";bar.setAttribute("role","status");bar.textContent=`RECONNECTING · ${state.runError||state.libraryError||state.modelsError}`;const retry=document.createElement("button");retry.type="button";retry.className="system-action";retry.textContent="RETRY";retry.addEventListener("click",()=>{fetchRuns();fetchLibrary();fetchModels(true)});bar.append(retry);box.append(bar);parent.append(box)}
    function normalizeRuns(payload){const raw=Array.isArray(payload)?payload:Array.isArray(payload?.runs)?payload.runs:[];return raw.filter(Boolean).map((run,index)=>{const tasks=Array.isArray(run.tasks)?run.tasks:[];const records=tasks.flatMap(task=>Array.isArray(task.attempt_records)?task.attempt_records:[]),recorded=records.map(r=>recordedNumber(r.tokens)).filter(n=>n!=null),runTokens=recordedNumber(run.tokens);return{...run,__id:String(run.run_id||run.id||`run-${index}`),run_name:String(run.run_name||"ringer"),state:String(run.state||(!run.finished?"live":"finished")).toLowerCase(),tasks,tokens:runTokens??(recorded.length?recorded.reduce((sum,n)=>sum+n,0):null)}}).sort((a,b)=>parseTime(b.started_at)-parseTime(a.started_at)).slice(0,12)}
    function preserveScroll(mutate){const saved=new Map([...document.querySelectorAll("[data-preserve-scroll]")].map(node=>[node.dataset.preserveScroll,[node.scrollLeft,node.scrollTop]]));mutate();document.querySelectorAll("[data-preserve-scroll]").forEach(node=>{const pos=saved.get(node.dataset.preserveScroll);if(pos)node.scrollTo(pos[0],pos[1])})}
    function morphChildren(have,want){if(!have||!want)return;have.replaceChildren(...want.childNodes)}
    function timedAttempt(task,record,index,run){const started=parseTime(record?.started_at),recordedDuration=recordedNumber(record?.duration_ms);let duration=recordedDuration;if(duration==null||duration<=0){duration=taskIsRunning(task)&&started?Math.max(1,Date.now()-started):0}return{task,record,index,run,lane:taskKey(task),attempt:String(record?.attempt??index+1),start:started,duration,recordedDuration,tokens:recordedNumber(record?.tokens),model:String(record?.model||task?.model||"unrecorded"),status:attemptVerdict(record)}}
    function allAttempts(){return state.runs.flatMap(run=>run.tasks.flatMap((task,ti)=>{const records=Array.isArray(task.attempt_records)?task.attempt_records:[];return records.map((record,ri)=>timedAttempt(task,record,ri,run))}))}
    function rowData(){
      if(state.group==="runs")return state.runs.map(run=>({id:run.__id,name:run.run_name,meta:`${projectInfo(run).name} · ${run.state}`,run,attempts:allAttempts().filter(a=>a.run===run),lanes:run.tasks.length,tokens:run.tokens,live:run.state==="live"}));
      const map=new Map();allAttempts().forEach(a=>{const id=state.group==="artifacts"?a.run.run_name:a.model;if(!map.has(id))map.set(id,{id,name:id,meta:state.group==="artifacts"?"artifact":"model",attempts:[],lanes:new Set(),tokens:null,live:false});const row=map.get(id);row.attempts.push(a);row.lanes.add(a.lane);if(a.tokens!=null)row.tokens=(row.tokens??0)+a.tokens;row.live ||= a.run.state==="live"});
      return [...map.values()].map(row=>({...row,lanes:row.lanes.size})).sort((a,b)=>Math.max(0,...b.attempts.map(x=>x.start))-Math.max(0,...a.attempts.map(x=>x.start)));
    }
    function axisBounds(){const end=Date.now(),start=end-state.windowMinutes*60000;return{start,end,span:end-start}}
    function pct(ms,bounds){return Math.max(0,Math.min(100,(ms-bounds.start)/bounds.span*100))}
    function gridlines(host,bounds,labels=false){for(let i=0;i<=4;i+=1){const line=document.createElement("span");line.className="gridline";line.style.left=`${i*25}%`;host.append(line);if(labels){const label=document.createElement("span");label.className="tick-label";label.style.left=`${i*25}%`;label.textContent=new Date(bounds.start+bounds.span*i/4).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});host.append(label)}}const now=document.createElement("span");now.className="now-line";now.style.left="100%";host.append(now)}
    function renderHead(bounds){const want=document.createElement("div");want.className="strip-head";want.append(document.createElement("span"));const axis=document.createElement("div");axis.className="axis-head";gridlines(axis,bounds,true);want.append(axis,document.createElement("span"));morphChildren(els.head,want)}
    function makeBar(a,bounds,detail=false){const bar=document.createElement("span");bar.className=detail?"detail-bar":`attempt-bar ${a.status==="retry"?"working":a.status}`;if(!detail){bar.dataset.stripBar="";bar.dataset.lane=a.lane;bar.dataset.attempt=a.attempt;bar.dataset.startMs=String(a.start);bar.dataset.durationMs=String(a.duration);bar.style.left=`${pct(a.start,bounds)}%`;bar.style.width=`${Math.max(.08,a.duration/bounds.span*100)}%`;bar.setAttribute("aria-label",`${a.lane}, attempt ${a.attempt}, ${taskStateText(a.status)}`);bar.title=bar.getAttribute("aria-label")}const worker=document.createElement("span");worker.className=detail?"detail-worker":"worker-head";const workerMs=numberOrZero(a.record.worker_duration_ms)||Math.max(0,a.duration-numberOrZero(a.record.check_duration_ms));worker.style.width=`${a.duration?Math.min(100,workerMs/a.duration*100):0}%`;bar.append(worker);return bar}
    function makeAxis(row,bounds){const axis=document.createElement("div");axis.className="axis";axis.dataset.stripAxis="";gridlines(axis,bounds);const timed=row.attempts.filter(a=>a.start&&a.duration);timed.forEach(a=>axis.append(makeBar(a,bounds)));const missing=new Map();row.attempts.filter(a=>!a.start||!a.duration).forEach(a=>missing.set(a.lane,a));[...missing.values()].forEach((a,index)=>{const note=document.createElement("span");note.className="missing-time";note.dataset.stripMissing="";note.dataset.lane=a.lane;note.textContent=`${index?" · ":""}${a.lane}: timing was not recorded`;axis.append(note)});return axis}
    function burnRate(row){const measured=row.attempts.filter(a=>a.tokens!=null&&a.recordedDuration!=null&&a.recordedDuration>0);if(!measured.length)return null;return measured.reduce((sum,a)=>sum+a.tokens,0)/measured.reduce((sum,a)=>sum+a.recordedDuration,0)*1000}
    function makeLedger(row){const ledger=document.createElement("div");ledger.className="ledger";const lanes=document.createElement("span");lanes.className="lane-count";lanes.textContent=String(row.lanes);const tokens=document.createElement("span");tokens.className="token-count";tokens.dataset.rowTokens="";tokens.textContent=formatTokens(row.tokens);const rowRate=burnRate(row);const toggle=document.createElement("button");toggle.type="button";toggle.className="burn-toggle";toggle.dataset.burnToggle="";toggle.setAttribute("aria-label",`${state.burnRows.has(row.id)?"Hide":"Show"} burn for ${row.name}`);toggle.setAttribute("aria-pressed",String(state.burnRows.has(row.id)));const track=document.createElement("span");track.className="burn-track";const fill=document.createElement("span");fill.className="burn-fill";fill.style.width=`${rowRate==null?0:Math.min(100,rowRate/100)}%`;track.append(fill);const rate=document.createElement("span");rate.className="burn-rate";rate.dataset.rowRate="";rate.textContent=rowRate==null?"—":`${Math.round(rowRate)} tok/s`;toggle.append(track,rate);toggle.addEventListener("click",event=>{event.stopPropagation();if(state.burnRows.has(row.id))state.burnRows.delete(row.id);else state.burnRows.add(row.id);render()});ledger.append(lanes,tokens,toggle);return ledger}
    function makeBurn(row,bounds){const grid=document.createElement("div");grid.className="burn-grid";grid.dataset.burn="";grid.append(document.createElement("span"));const axis=document.createElement("div");axis.className="burn-axis";gridlines(axis,bounds);const rates=row.attempts.filter(a=>a.start&&a.duration&&a.tokens).map(a=>({...a,rate:a.tokens/(a.duration/1000)}));const max=Math.max(1,...rates.map(a=>a.rate));rates.forEach(a=>{const block=document.createElement("span");block.className="burn-block";block.style.left=`${pct(a.start,bounds)}%`;block.style.width=`${Math.max(.08,a.duration/bounds.span*100)}%`;block.style.height=`${Math.max(2,a.rate/max*38)}px`;block.title=`${a.lane}, attempt ${a.attempt}, ${Math.round(a.rate)} tokens per second`;axis.append(block)});grid.append(axis,document.createElement("span"));return grid}
    function failureText(a){const r=a.record;if(a.status!=="fail")return"";const parts=[];if(r.check_output_excerpt)parts.push(String(r.check_output_excerpt));if(Array.isArray(r.missing_expect_files)&&r.missing_expect_files.length)parts.push(`missing: ${r.missing_expect_files.join(", ")}`);return parts.join(" · ")}
    function makeOpenPanel(run){const panel=document.createElement("section");panel.className="open-panel";panel.dataset.openPanel="";const head=document.createElement("header");head.className="open-head";const title=document.createElement("strong");title.textContent=run.run_name;const meta=document.createElement("span");meta.textContent=`${projectInfo(run).name} · ${relativeAgo(run.started_at)}`;const links=document.createElement("span");links.className="open-links";const artifact=document.createElement("a");artifact.href=`/artifacts/${encodeURIComponent(run.run_name)}`;artifact.textContent="artifact";const log=document.createElement("a");log.href=String(run.log_path||`/api/runs/${encodeURIComponent(run.__id)}/log`);log.textContent="log";links.append(artifact,log);head.append(title,meta,links);panel.append(head);run.tasks.forEach((task,ti)=>(Array.isArray(task.attempt_records)?task.attempt_records:[]).forEach((record,ri)=>{const a=timedAttempt(task,record,ri,run);const row=document.createElement("div");row.className="attempt-detail";row.dataset.attemptRow="";row.dataset.model=a.model;row.dataset.tokens=String(a.tokens);const who=document.createElement("span");who.textContent=`${a.lane} · #${a.attempt} ${taskStateText(a.status)}`;row.append(who,makeBar(a,axisBounds(),true));const tok=document.createElement("span");tok.textContent=formatTokens(a.tokens);const model=document.createElement("span");model.textContent=`${a.model} · ${record.reasoning_effort||"—"}`;const split=document.createElement("span");split.textContent=`${formatDuration(numberOrZero(record.worker_duration_ms)/1000)} / ${formatDuration(numberOrZero(record.check_duration_ms)/1000)}`;row.append(tok,model,split);const reason=failureText(a);if(reason){const note=document.createElement("span");note.className="attempt-reason";note.textContent=reason;row.append(note)}const flags=[];if(record.model_mismatch)flags.push("model mismatch");if(numberOrZero(record.worker_returncode)!==0)flags.push(`worker rc ${record.worker_returncode}`);if(record.worker_timed_out)flags.push("worker timed out");if(record.worker_error)flags.push(String(record.worker_error));if(flags.length){const note=document.createElement("span");note.className="attempt-flags";note.textContent=flags.join(" · ");row.append(note)}panel.append(row)}));return panel}
    function makeRow(row,index,total,bounds){const shell=document.createElement("article");shell.className=`strip-row${row.live?" live":""}${state.openRunId===row.id?" open":""}`;const button=document.createElement("button");button.type="button";button.className="strip-row-grid";button.dataset.stripRow="";button.dataset.rowId=row.id;if(row.run)button.dataset.runId=row.run.__id;button.setAttribute("aria-label",`${row.name}, ${row.meta}`);const ident=document.createElement("span");ident.className="identity";const swatch=document.createElement("span");swatch.className=`swatch burn-${Math.max(1,Math.min(4,4-Math.floor(index/Math.max(1,total/4))))}`;const copy=document.createElement("span");copy.className="identity-copy";const name=document.createElement("span");name.className="row-name";name.textContent=row.name;const meta=document.createElement("span");meta.className="row-meta";meta.textContent=row.meta;copy.append(name,meta);ident.append(swatch,copy);button.append(ident,makeAxis(row,bounds),makeLedger(row));if(row.run)button.addEventListener("click",()=>{state.openRunId=state.openRunId===row.id?"":row.id;render()});shell.append(button);if(state.burnRows.has(row.id))shell.append(makeBurn(row,bounds));return shell}
    function awaitingPilot(run){const status=String(run.pilot?.status||run.pilot_status||run.status||"").toLowerCase();return Boolean(run.awaiting_pilot||run.pilot_pending||status==="awaiting_pilot"||status==="pilot")}
    async function submitPilotDecision(run,decision,note=""){const id=run.__id;const urls=[`/api/runs/${encodeURIComponent(id)}/pilot`,"/api/pilot"];let response;for(const url of urls){response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({run_id:id,decision,note})});if(response.status!==404)break}if(!response?.ok)throw new Error(`HTTP ${response?.status||0}`);await fetchRuns()}
    function renderPilot(){const want=document.createElement("div");state.runs.filter(awaitingPilot).forEach(run=>{const banner=document.createElement("div");banner.className="pilot-banner";const text=document.createElement("span");text.append(Object.assign(document.createElement("strong"),{textContent:run.run_name}),` · ${relativeAgo(run.pilot?.requested_at||run.started_at)}`);const actions=document.createElement("span");actions.className="pilot-actions";["approve","reject"].forEach(decision=>{const button=document.createElement("button");button.type="button";button.textContent=decision[0].toUpperCase()+decision.slice(1);button.addEventListener("click",()=>submitPilotDecision(run,decision));actions.append(button)});banner.append(text,actions);want.append(banner)});morphChildren(els.pilot,want)}
    function render(){
      preserveScroll(()=>{const bounds=axisBounds();renderHead(bounds);const rows=rowData(),want=document.createElement("div");want.className="strip-list";rows.forEach((row,index)=>{want.append(makeRow(row,index,rows.length,bounds));if(state.openRunId===row.id&&row.run)want.append(makeOpenPanel(row.run))});if(!rows.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="No recorded attempts";want.append(empty)}morphChildren(els.list,want);const attempts=allAttempts(),recordedTokens=attempts.map(a=>a.tokens).filter(n=>n!=null);els.census.textContent=`${state.runs.length} runs · ${state.runs.reduce((n,r)=>n+r.tasks.length,0)} lanes · ${attempts.length} attempts · ${formatTokens(recordedTokens.length?recordedTokens.reduce((n,value)=>n+value,0):null)}`;renderPilot();const sys=document.createElement("div");appendSystemStates(sys);morphChildren(els.system,sys)});
    }
    async function fetchRuns(){try{const response=await fetch("/api/runs",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);const payload=await response.json();state.runs=normalizeRuns(payload);state.serverVersion=String(payload?.server?.ringer_version||"");state.active=payload?.active||{};state.update=payload?.update||null;state.runError=null}catch(error){state.runError=error?.message||"runs unavailable"}render()}
    async function fetchLibrary(){try{const response=await fetch("/api/library",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);state.artifacts=await response.json();state.libraryError=null}catch(error){state.libraryError=error?.message||"library unavailable"}}
    async function fetchModels(force=false){try{const response=await fetch("/api/models",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);state.models=await response.json();state.modelsError=null}catch(error){state.modelsError=error?.message||"models unavailable"}if(force)render()}
    document.querySelector(".grouping").addEventListener("click",event=>{const button=event.target.closest("[data-group]");if(!button)return;state.group=button.dataset.group;state.openRunId="";document.querySelectorAll("[data-group]").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));if(state.group==="models")fetchModels();render()});
    document.getElementById("window-control").addEventListener("change",event=>{state.windowMinutes=numberOrZero(event.target.value)||60;render()});
    const themeGroup=document.getElementById("theme-controls");themeGroup.addEventListener("click",event=>{const option=event.target.closest("[data-theme-choice]");if(option)selectTheme(option.dataset.themeChoice);const pick=event.target.closest("[data-theme-pick]");if(pick){selectNamedTheme(pick.dataset.themePick);document.getElementById("theme-picker").open=false}});
    themeGroup.addEventListener("keydown",event=>{const options=[...themeGroup.querySelectorAll("[data-theme-choice]")],current=options.indexOf(document.activeElement);if(current<0)return;let next=current;if(["ArrowRight","ArrowDown"].includes(event.key))next=(current+1)%options.length;else if(["ArrowLeft","ArrowUp"].includes(event.key))next=(current-1+options.length)%options.length;else return;event.preventDefault();selectTheme(options[next].dataset.themeChoice,true)});
    themeMedia.addEventListener("change",()=>{if(themeChoice==="system")applyThemeChoice()});
    function tickClock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
    tickClock();setInterval(tickClock,1000);fetchRuns();fetchLibrary();setInterval(fetchRuns,1000);setInterval(fetchLibrary,2000);setInterval(()=>fetchModels(true),30000);
  })();
  </script>
