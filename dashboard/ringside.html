        const run = document.createElement("span");

        );

        const burn = document.createElement("span");

        );
        const burnMeter = document.createElement("span");

        burnMeter.setAttribute("aria-valuemax", "100");
        burnMeter.setAttribute("aria-valuenow", String(Math.min(100, burnShare)));
        burnMeter.setAttribute("aria-label", `${entry.key} used ${burnShare.toFixed(1)} percent of ${formatTokens(runTokens)} run tokens`);
        const burnFill = document.createElement("span");
        burnFill.className = "lane-meter-fill";
        burnFill.style.width = `${Math.min(100, burnShare)}%`;
        burnMeter.appendChild(burnFill);
        const burnCaption = document.createElement("span");
        burnCaption.className = `lane-meter-caption${burnLeader ? " burn-leader" : ""}`;
        burnCaption.textContent = burnLeader ? "Burn leader · run share" : "of run total";
        burn.append(burnTop, burnMeter, burnCaption);

        const timeout = document.createElement("span");
        timeout.className = "lane-timeout";
        const timeoutTop = document.createElement("span");
        timeoutTop.className = "lane-meter-top";
        timeoutTop.append(
          Object.assign(document.createElement("span"), {textContent: formatDuration(elapsedSeconds)}),
          Object.assign(document.createElement("small"), {textContent: timeoutSeconds ? `/ ${formatDuration(timeoutSeconds)}` : "/ no budget"})
        );
        const timeoutMeter = document.createElement("span");
        timeoutMeter.className = "lane-meter";
        timeoutMeter.setAttribute("role", "meter");
        timeoutMeter.setAttribute("aria-valuemin", "0");

        timeoutMeter.setAttribute("aria-valuenow", String(timeoutSeconds ? Math.min(timeoutSeconds, elapsedSeconds) : 0));
        timeoutMeter.setAttribute("aria-label", timeoutSeconds ? `${entry.key} has used ${timeoutPercent.toFixed(1)} percent of its timeout` : `${entry.key} timeout budget not reported`);
        const timeoutFill = document.createElement("span");
        timeoutFill.className = "lane-meter-fill";
        timeoutFill.style.width = `${Math.min(100, timeoutPercent)}%`;
        timeoutMeter.appendChild(timeoutFill);
        const attempts = Math.max(0, Math.floor(numberOrZero(entry.task.attempts)));
        const maxAttempts = Math.max(attempts, Math.floor(numberOrZero(entry.task.max_attempts)));
        const timeoutCaption = document.createElement("span");

        const causeCell = document.createElement("span");

        causeEvidence.className = "lane-cause-evidence";
        cause.evidence.filter(item => !item.startsWith("check=")).forEach(item => {
          const evidenceItem = document.createElement("span");

        });

        if (cause.isFailure && String(entry.task.check || "").trim()) {

        row.append(dot, identity, run, route, activity, burn, timeout, causeCell);
        const runIdValue = entry.run.__id;
        const laneKeyValue = entry.key;
        row.addEventListener("click", event => {
          const currentRun = state.runs.find(runItem => runItem.__id === runIdValue);
          openRunPanel(runIdValue, event.currentTarget);
          if (currentRun) selectPanelLane(currentRun, laneKeyValue);
        });
        staging.appendChild(row);
      });
      if (!entries.length) staging.append(Object.assign(document.createElement("p"), {className:"held-callout",textContent:"No lanes have reported in yet."}));
      morphChildren(els.lanesView, staging);
    }

    function renderCanvasView() {
      const staging = document.createElement("div");
      appendSystemStates(staging);
      const run = canvasRun();
      if (!run) {
        els.canvasView.dataset.tokenMax = "1";
        els.canvasView.dataset.samples = "0";
        const head = document.createElement("header");
        head.className = "view-title-row";
        head.dataset.key = "canvas-head";
        head.innerHTML = '<h1 id="canvas-title">Time Canvas</h1><p class="view-meta">Observed token traces on run-relative time</p><p class="view-sort">fitted window</p>';
        const empty = document.createElement("p");
        empty.className = "canvas-empty";
        empty.dataset.key = "canvas-empty";
        empty.textContent = "No run telemetry is available for the canvas yet.";
        staging.append(head, empty);
        morphChildren(els.canvasView, staging);
        return;
      }

      const buffer = state.canvasSamples.get(run.__id) || {samples: [], retryEvents: new Map(), observedStarts: new Map()};
      const samples = buffer.samples.length;
      const {axisMax, budget, steps} = canvasAxisDomain(run);
      const previousAxis = state.canvasAxisMax.get(run.__id);
      const rescaled = Boolean(previousAxis && previousAxis !== axisMax);
      state.canvasAxisMax.set(run.__id, axisMax);
      const tokenMax = canvasTokenMax(run, buffer);
      const elapsed = canvasElapsed(run);
      const nowPercent = Math.min(100, (elapsed / axisMax) * 100);
      const tickEvery = canvasTickEvery(axisMax);
      const highestTokens = Math.max(0, ...run.tasks.map(task => numberOrZero(task.tokens)));
      const nextStep = steps[steps.indexOf(axisMax) + 1];
      els.canvasView.dataset.tokenMax = String(tokenMax);
      els.canvasView.dataset.samples = String(samples);

      const head = document.createElement("header");
      head.className = "view-title-row";
      head.dataset.key = "canvas-head";
      const title = document.createElement("h1");
      title.id = "canvas-title";
      title.textContent = "Time Canvas";
      const meta = document.createElement("p");
      meta.className = "view-meta";
      meta.textContent = `${projectInfo(run).name} / ${run.run_name} · ${run.tasks.length} lanes`;
      const sort = document.createElement("p");
      sort.className = "view-sort";
      sort.textContent = run.state === "live" ? "run active · observed each poll" : "run complete · observed samples";
      head.append(title, meta, sort);
      staging.appendChild(head);

      const census = document.createElement("section");
      census.className = "canvas-census";
      census.dataset.key = `canvas-census:${run.__id}`;
      census.setAttribute("aria-label", `${run.run_name} Time Canvas summary`);
      const addCensus = (label, value, note) => {
        const cell = document.createElement("div");
        cell.className = "canvas-census-cell";
        const labelNode = document.createElement("span");
        labelNode.className = "canvas-census-label";
        labelNode.textContent = label;
        const valueNode = document.createElement("span");
        valueNode.className = "canvas-census-value";
        valueNode.textContent = value;
        const noteNode = document.createElement("span");
        noteNode.className = "canvas-census-note";
        noteNode.textContent = note;
        cell.append(labelNode, valueNode, noteNode);
        census.appendChild(cell);
      };
      addCensus("Run", run.run_name, `${projectInfo(run).name} · max parallel ${Math.max(0, Math.floor(numberOrZero(run.max_parallel))) || "—"}`);
      addCensus("Elapsed", canvasTime(elapsed), run.state === "live" ? "run-relative now" : "final observed time");
      addCensus("Tokens so far", formatTokens(run.tokens).replace(" tok", ""), `shared lane scale · 0—${tokenMax.toLocaleString()}`);
      addCensus("Observed samples", String(samples), samples < 2 ? "collecting history · no trace yet" : "real poll snapshots · buffer capped at 900");
      staging.appendChild(census);

      const wall = document.createElement("section");
      wall.className = `canvas-wall${rescaled ? " canvas-rescaled" : ""}`;
      wall.dataset.key = `canvas-wall:${run.__id}`;
      wall.setAttribute("aria-label", `${run.run_name} lanes on a shared run-relative time and token scale`);
      const axis = document.createElement("div");
      axis.className = "canvas-axis";
      axis.dataset.key = `canvas-axis:${run.__id}`;
      axis.dataset.axisMaxS = String(Math.round(axisMax));
      axis.setAttribute("aria-label", `Fitted run-relative axis from zero to ${canvasTime(axisMax)}; now ${canvasTime(elapsed)}${budget ? `; timeout ${canvasTime(budget)}` : "; no timeout reported"}`);
      const axisIntro = document.createElement("div");
      axisIntro.className = "canvas-axis-intro";
      axisIntro.dataset.key = "canvas-axis-intro";
      axisIntro.append(
        Object.assign(document.createElement("span"), {className: "canvas-kicker", textContent: "Trace height = tokens"}),
        Object.assign(document.createElement("span"), {className: "canvas-axis-sub", textContent: "one vertical scale across every lane"})
      );
      const axisStage = document.createElement("div");
      axisStage.className = "canvas-axis-stage";
      axisStage.dataset.key = "canvas-axis-stage";
      axisStage.setAttribute("aria-hidden", "true");
      const tickValues = [];
      for (let tick = 0; tick <= axisMax; tick += tickEvery) tickValues.push(tick);
      if (tickValues[tickValues.length - 1] !== axisMax) tickValues.push(axisMax);
      tickValues.forEach((tick, index) => {
        const tickNode = document.createElement("span");
        const end = tick === axisMax;
        tickNode.className = `canvas-tick${index % 2 === 0 || end ? " major" : ""}${end ? " end" : ""}`;
        tickNode.dataset.key = `canvas-axis-tick:${tick}`;
        tickNode.style.left = `${(tick / axisMax) * 100}%`;
        const tickLabel = document.createElement("span");
        tickLabel.className = "canvas-tick-label";
        tickLabel.textContent = canvasTime(tick);
        tickNode.appendChild(tickLabel);
        axisStage.appendChild(tickNode);
      });
      const nowHead = document.createElement("span");
      nowHead.className = `canvas-now-head${nowPercent > 86 ? " near-edge" : ""}`;
      nowHead.dataset.key = "canvas-now-head";
      nowHead.style.left = `${nowPercent}%`;
      nowHead.appendChild(Object.assign(document.createElement("span"), {textContent: "NOW"}));
      axisStage.appendChild(nowHead);
      const timeoutHead = document.createElement("div");
      timeoutHead.className = `canvas-timeout-head${budget && budget <= axisMax ? " in-domain" : ""}`;
      timeoutHead.dataset.key = "canvas-timeout-head";
      timeoutHead.textContent = budget ? (budget <= axisMax ? `timeout marker · ${canvasTime(budget)}` : `→ timeout ${canvasTime(budget)}`) : "timeout not reported";
      axis.append(axisIntro, axisStage, timeoutHead);
      wall.appendChild(axis);

      run.tasks.forEach((task, index) => {
        const key = taskKey(task, index);
        const kind = taskKind(task);
        const statusText = taskStateText(kind);
        const taskTokens = Math.max(0, numberOrZero(task.tokens));
        const taskElapsed = Math.max(0, numberOrZero(task.elapsed_s));
        const laneFinished = kind === "pass" || kind === "fail";
        const observedStart = buffer.observedStarts.get(key);
        const laneStart = laneFinished
          ? (Number.isFinite(observedStart) ? observedStart : null)
          : Math.max(0, Math.round(elapsed - taskElapsed));
        const laneStartKnown = laneStart !== null;
        const laneStartText = laneStartKnown
          ? `spawned ${canvasTime(laneStart)} after run start`
          : "spawn time not observed";
        const attempts = Math.max(0, Math.floor(numberOrZero(task.attempts)));
        const maxAttempts = Math.max(attempts, Math.floor(numberOrZero(task.max_attempts)));
        const timeout = Math.max(0, Math.floor(numberOrZero(task.timeout_s)));
        const retryEvents = buffer.retryEvents.get(key) || [];
        const points = buffer.samples.flatMap(sample => {
          const lane = sample.lanes.get(key);
          if (!lane || (laneStartKnown && sample.atS < laneStart) || sample.atS > axisMax) return [];
          return [{atS: sample.atS, tokens: lane.tokens}];
        });
        const pointText = points.map(point => {
          const x = Math.max(0, Math.min(1000, (point.atS / axisMax) * 1000));
          const y = Math.max(4, Math.min(96, 96 - (point.tokens / tokenMax) * 90));
          return `${x.toFixed(2)},${y.toFixed(2)}`;
        }).join(" ");
        const lastPoint = points[points.length - 1];
        const cause = laneCause(task);
        const activity = taskActivity(task) || "No activity reported";
        const traceState = points.length < 2 ? "collecting observed history" : `${points.length} observed points`;
        const retrySummary = retryEvents.length
          ? `${retryEvents.length} retry boundary${retryEvents.length === 1 ? "" : "ies"} observed`
          : attempts > 1 ? "multi-attempt; retry boundary was not observed" : "single attempt observed";
        const lane = document.createElement("article");
        lane.className = "canvas-lane-track";
        lane.dataset.key = `canvas-lane:${run.__id}:${key}`;
        if (laneStartKnown) lane.dataset.laneStartS = String(laneStart);
        lane.setAttribute("aria-label", `${key}, ${statusText}, ${laneStartText}, ${formatTokens(taskTokens)}, ${traceState}, ${retrySummary}, ${cause.label}. ${cause.sentence} ${activity}`);

        const laneMeta = document.createElement("div");
        laneMeta.className = "canvas-lane-meta";
        laneMeta.dataset.key = `canvas-lane-meta:${key}`;
        const laneTop = document.createElement("div");
        laneTop.className = "canvas-lane-top";
        const laneKeyNode = document.createElement("span");
        laneKeyNode.className = "canvas-lane-key";
        laneKeyNode.textContent = key;
        const status = document.createElement("span");
        status.className = `canvas-status ${kind}`;
        status.textContent = statusText;
        laneTop.append(laneKeyNode, status);
        const route = document.createElement("span");
        route.className = "canvas-route";
        route.append(document.createTextNode(`${String(task.engine || "engine not reported")} · `), Object.assign(document.createElement("code"), {textContent: String(task.model || "model not reported")}));
        const stats = document.createElement("span");
        stats.className = "canvas-lane-stats";
        const laneStatValues = [
          [`${canvasTime(taskElapsed)} / ${timeout ? canvasTime(timeout) : "no timeout"}`, "elapsed"],
          [formatTokens(taskTokens), "tokens"],
          [`${attempts || "—"}/${maxAttempts || "—"}`, "attempt"]
        ];
        laneStatValues.forEach(([value, label]) => {
          const stat = document.createElement("span");
          const strong = document.createElement("strong");
          strong.textContent = value;
          stat.append(strong, document.createTextNode(` ${label}`));
          stats.appendChild(stat);
        });
        laneMeta.append(laneTop, route, stats);

        const plot = document.createElement("div");
        plot.className = "canvas-track-plot";
        plot.dataset.key = `canvas-plot:${key}`;
        plot.setAttribute("aria-hidden", "true");
        tickValues.forEach(tick => {
          const line = document.createElement("span");
          line.className = `canvas-grid-line${tick % (tickEvery * 2) === 0 ? " major" : ""}`;
          line.dataset.key = `canvas-grid:${key}:${tick}`;
          line.style.left = `${(tick / axisMax) * 100}%`;
          plot.appendChild(line);
        });
        const baseline = document.createElement("span");
        baseline.className = "canvas-baseline";
        baseline.dataset.key = `canvas-baseline:${key}`;
        plot.appendChild(baseline);
        if (laneStartKnown && laneStart > 0) {
          const queueGap = document.createElement("span");
          queueGap.className = "canvas-queue-gap";
          queueGap.dataset.key = `canvas-queue-gap:${key}`;
          queueGap.style.width = `${Math.min(100, (laneStart / axisMax) * 100)}%`;
          plot.appendChild(queueGap);
        }
        if (laneStartKnown) {
          const spawnLine = document.createElement("span");
          spawnLine.className = "canvas-spawn-line";
          spawnLine.dataset.key = `canvas-spawn:${key}`;
          spawnLine.style.left = `${Math.min(100, (laneStart / axisMax) * 100)}%`;
          plot.appendChild(spawnLine);
        }
        const nowLine = document.createElement("span");
        nowLine.className = "canvas-now-line";
        nowLine.dataset.key = `canvas-now:${key}`;
        nowLine.style.left = `${nowPercent}%`;
        plot.appendChild(nowLine);
        if (timeout && timeout <= axisMax) {
          const timeoutLine = document.createElement("span");
          timeoutLine.className = "canvas-timeout-line";
          timeoutLine.dataset.key = `canvas-timeout:${key}`;
          timeoutLine.style.left = `${(timeout / axisMax) * 100}%`;
          plot.appendChild(timeoutLine);
        }
        retryEvents.filter(event => (!laneStartKnown || event.atS >= laneStart) && event.atS <= axisMax).forEach((event, eventIndex) => {
          const retry = document.createElement("span");
          retry.className = "canvas-retry-line";
          retry.dataset.key = `canvas-retry:${key}:${eventIndex}:${event.atS}`;
          retry.style.left = `${(event.atS / axisMax) * 100}%`;
          plot.appendChild(retry);
        });
        if (points.length >= 2) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "canvas-trace");
          svg.setAttribute("viewBox", "0 0 1000 100");
          svg.setAttribute("preserveAspectRatio", "none");
          svg.dataset.key = `canvas-trace:${key}`;
          const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
          polyline.setAttribute("class", kind);
          polyline.setAttribute("points", pointText);
          polyline.dataset.key = `canvas-trace-line:${key}`;
          const endX = Math.max(0, Math.min(1000, (lastPoint.atS / axisMax) * 1000));
          const endY = Math.max(4, Math.min(96, 96 - (lastPoint.tokens / tokenMax) * 90));
          const endpoint = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          endpoint.setAttribute("class", `canvas-endpoint ${kind}`);
          endpoint.setAttribute("x", String(endX - 3));
          endpoint.setAttribute("y", String(endY - 3));
          endpoint.setAttribute("width", "6");
          endpoint.setAttribute("height", "6");
          endpoint.dataset.key = `canvas-endpoint:${key}`;
          svg.append(polyline, endpoint);
          plot.appendChild(svg);
        } else {
          const collecting = document.createElement("span");
          collecting.className = "canvas-collecting";
          collecting.dataset.key = `canvas-collecting:${key}`;
          collecting.textContent = "Collecting observed history — trace starts after the next poll";
          plot.appendChild(collecting);
        }
        const foot = document.createElement("span");
        foot.className = "canvas-track-foot";
        foot.dataset.key = `canvas-track-foot:${key}`;
        const activityNode = document.createElement("span");
        activityNode.textContent = activity;
        const rankNode = document.createElement("span");
        rankNode.className = "canvas-burn-rank";
        rankNode.textContent = taskTokens > 0 && taskTokens === highestTokens ? "highest burn" : "";
        foot.append(activityNode, rankNode);
        plot.appendChild(foot);

        const note = document.createElement("div");
        note.className = "canvas-lane-note";
        note.dataset.key = `canvas-note:${key}`;
        const noteKicker = document.createElement("span");
        noteKicker.className = "canvas-note-kicker";
        noteKicker.textContent = cause.label;
        const noteMain = document.createElement("span");
        noteMain.className = `canvas-note-main${cause.isFailure ? " fail" : ""}`;
        noteMain.textContent = cause.sentence;
        const noteSub = document.createElement("span");
        noteSub.className = `canvas-note-sub${cause.isFailure ? " fail" : ""}`;
        noteSub.textContent = retryEvents.length
          ? `retry observed at ${canvasTime(retryEvents[retryEvents.length - 1].atS)} · ${laneStartKnown ? `spawned ${canvasTime(laneStart)}` : laneStartText}`
          : attempts > 1
            ? `multi-attempt · boundary not observed · ${laneStartKnown ? `spawned ${canvasTime(laneStart)}` : laneStartText}`
            : laneStartText;
        note.append(noteKicker, noteMain, noteSub);
        lane.append(laneMeta, plot, note);
        wall.appendChild(lane);
      });

      const footer = document.createElement("footer");
      footer.className = "canvas-footer";
      footer.dataset.key = `canvas-footer:${run.__id}`;
      const brand = document.createElement("span");
      brand.append(Object.assign(document.createElement("strong"), {textContent: "TIME CANVAS"}), document.createTextNode(" / fitted window"));
      const legend = document.createElement("span");
      legend.className = "canvas-legend";
      legend.setAttribute("aria-label", "Trace legend");
      [["", "observed token accumulation"], ["flat", "flat = no token change observed"], ["gap", "gap = queue wait / observed retry"]].forEach(([kindName, label]) => {
        const item = document.createElement("span");
        item.className = "canvas-legend-item";
        const line = document.createElement("span");
        line.className = `canvas-legend-line${kindName ? ` ${kindName}` : ""}`;
        line.setAttribute("aria-hidden", "true");
        item.append(line, document.createTextNode(label));
        legend.appendChild(item);
      });
      const windowPolicy = document.createElement("span");
      windowPolicy.className = "canvas-window";
      windowPolicy.textContent = nextStep ? `window ${canvasTime(axisMax)} · next ${canvasTime(nextStep)}` : `window ${canvasTime(axisMax)} · ${budget ? "budget ceiling" : "open ceiling"}`;
      footer.append(brand, legend, windowPolicy);
      wall.appendChild(footer);
      staging.appendChild(wall);
      preserveScroll(() => morphChildren(els.canvasView, staging));
    }

    function renderReviewsView() {
      const staging=document.createElement("div"); const queue=reviewRuns(); const run=queue.find(item=>item.__id===state.focusedRunId)||queue[0];
      appendSystemStates(staging);

        if (state.artifactSort === "name-asc" || state.artifactSort === "name-desc") {
          return direction * String(left.label || "").localeCompare(String(right.label || ""), undefined, {sensitivity: "base"});

        const rightValid = Number.isFinite(rightTime);
        if (leftValid !== rightValid) return leftValid ? -1 : 1;
        if (leftValid && leftTime !== rightTime) return direction * (leftTime - rightTime);

      });

      if (decision === "revise" && !cleanNote) return;
      if (decision === "reject" && !window.confirm("Reject this pilot and end the run?")) return;
      state.pilotDecisions.set(run.__id, {inFlight: true, decision, error: "", result: "", revisions: numberOrZero(run.pilot?.revisions)});
      renderRunsOverview();
      if (state.shellView === "reviews") renderReviewsView();
      try {
        const response = await fetch("/api/pilot/decision", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(decision === "revise"
            ? {run_id: run.__id, decision, note: cleanNote}
            : {run_id: run.__id, decision})
        });
        let payload = {};
        try { payload = await response.json(); } catch (_error) {}
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        state.pilotDecisions.set(run.__id, {
          inFlight: false,
          decision,
          error: "",
          result: String(payload.decision || decision),
          revisions: numberOrZero(run.pilot?.revisions)

        if (decision === "revise") state.pilotNotes.delete(run.__id);

    function normalizeArtifactState(value) {
      const text = String(value || "").toLowerCase();
      if (text === "live") return "live";
      if (text === "pass" || text === "finished") return "pass";
      if (text === "fail") return "fail";
      if (text === "died") return "died";
      return "unknown";
    }

    function artifactStateClass(value) {
      const normalized = normalizeArtifactState(value);
      return normalized === "died" ? "fail" : normalized;
    }

    function artifactVersionKey(version, index) {
      return String(version.path || version.run_id || `${version.finished_at || ""}-${version.outcome || ""}-${index}`);
    }

    function normalizeLibrary(payload) {
      const artifacts = payload?.artifacts && typeof payload.artifacts === "object" && !Array.isArray(payload.artifacts)
        ? payload.artifacts
        : {};
      return Object.entries(artifacts).map(([name, entry]) => {
        const item = entry && typeof entry === "object" ? entry : {};
        const versions = Array.isArray(item.versions) ? item.versions : [];
        const normalizedVersions = versions.map((version, index) => {
          const value = version && typeof version === "object" ? version : {};
          return {
            key: artifactVersionKey(value, index),
            run_id: String(value.run_id || ""),
            path: String(value.path || ""),
            finished_at: String(value.finished_at || ""),
            finishedTs: parseTime(value.finished_at),
            outcome: normalizeArtifactState(value.outcome),
            tasks_pass: numberOrZero(value.tasks_pass),
            tasks_fail: numberOrZero(value.tasks_fail)
          };
        }).sort((left, right) => right.finishedTs - left.finishedTs);
        const updatedAt = String(item.updated_at || "");
        const updatedTs = parseTime(updatedAt) || normalizedVersions[0]?.finishedTs || 0;
        const keyText = String(name || "artifact");
        return {
          name: keyText,
          // The key carries a `<project-slug>:` prefix for namespacing; that is
          // plumbing, not something a human should have to read.
          label: keyText.includes(":") ? keyText.slice(keyText.indexOf(":") + 1) : keyText,
          project: String(item.project || ""),
          live_path: String(item.live_path || ""),
          state: normalizeArtifactState(item.state),
          identity: String(item.identity || "unknown"),
          current_run_id: String(item.current_run_id || ""),
          updated_at: updatedAt,
          updatedTs,
          versions: normalizedVersions
        };
      }).filter(item => item.name).sort((left, right) => {
        const leftLive = left.state === "live" ? 1 : 0;
        const rightLive = right.state === "live" ? 1 : 0;
        if (leftLive !== rightLive) return rightLive - leftLive;
        // Stable within each group: two live runs must never swap rows as
        // their "updated Ns ago" leapfrogs every flush (demo-night lesson).
        return left.name.localeCompare(right.name);
      });
    }

    function sanitizeArtifactName(value) {
      return String(value || "artifact").replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^[.-]+|[.-]+$/g, "") || "artifact";
    }

    function artifactLiveHref(name) {
      return `/artifacts/live/${encodeURIComponent(sanitizeArtifactName(name))}.html`;
    }

    function artifactPathHref(path) {
      const text = String(path || "").replace(/\\/g, "/");
      const marker = "/artifacts/";
      const index = text.lastIndexOf(marker);
      const relative = index >= 0
        ? text.slice(index + marker.length)
        : text.replace(/^\/+/, "").replace(/^artifacts\//, "");
      const parts = relative.split("/").filter(Boolean).map(encodeURIComponent);
      return parts.length ? `/artifacts/${parts.join("/")}` : "";
    }

    function newestArtifact() {
      const live = state.artifacts.filter(item => item.state === "live").sort((left, right) => right.updatedTs - left.updatedTs);
      return live[0] || [...state.artifacts].sort((left, right) => right.updatedTs - left.updatedTs)[0] || null;
    }

    function selectedArtifact() {
      return state.artifacts.find(item => item.name === state.artifactName) || null;
    }

    function syncArtifactSelection() {
      if (!state.artifacts.length) {
        state.artifactName = "";
        state.artifactVersion = "live";
        return;
      }
      const current = selectedArtifact();
      if (state.artifactManual && current) {
        if (state.artifactVersion !== "live" && !current.versions.some(version => version.key === state.artifactVersion)) {
          state.artifactVersion = "live";
        }
        return;
      }
      if (state.artifactManual && !current) {
        state.artifactManual = false;
        sessionStorage.removeItem(ARTIFACT_KEY);
      }
      // Only choose FOR the user when nothing is on screen yet. A new live
      // run must never steal the view mid-review (demo-night lesson).
      if (current) return;
      const target = newestArtifact();
      if (target) {
        state.artifactName = target.name;
        state.artifactVersion = "live";
      }
    }

    function selectedArtifactTarget() {
      const artifact = selectedArtifact();
      if (!artifact) return null;
      if (state.artifactVersion !== "live") {
        const version = artifact.versions.find(item => item.key === state.artifactVersion);
        if (version) {
          const src = artifactPathHref(version.path);
          return {
            artifact,
            version,
            src,
            key: `${src}|version|${version.key}`
          };
        }
      }
      // Library keys are namespaced by project (`<project-slug>:<run_name>`), so
      // they are NOT a path component. Prefer the entry's recorded live_path;
      // fall back to the flat name for entries written before namespacing.
      const src = artifact.live_path
        ? artifactPathHref(artifact.live_path)
        : artifactLiveHref(artifact.label);
      return {
        artifact,
        version: null,
        src,
        key: `${src}|current|${artifact.state}`
      };
    }

    async function fetchRuns() {
      try {
        const response = await fetch("/api/runs", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const runs = normalizeRuns(payload);
        updateActivityChanges(runs);
        updateCanvasSamples(runs);
        state.runs = runs;
        state.serverVersion = String(payload?.server?.ringer_version || "").trim();
        state.runUnreadable = Math.max(0, Math.trunc(numberOrZero(payload?.unreadable)));
        state.active = payload?.active || {};
        state.update = payload?.update || null;
        state.runError = null;
        if (state.restoreRunFromUrl) {
          state.restoreRunFromUrl = false;
          const requested = state.runs.find(run => run.__id === state.focusedRunId);
          if (requested) {
            state.artifactName = requested.run_name;
            state.artifactManual = true;
            state.artifactVersion = "live";
            sessionStorage.setItem(ARTIFACT_KEY, requested.run_name);
          } else {
            state.focusedRunId = "";
          }
          replaceUrlState();
        }
        syncFocusedRunSelection();
      } catch (error) {
        state.runError = error?.message || "runs unavailable";
      }
      renderTop();
    }

        state.artifacts = normalizeLibrary(payload);
        state.libraryUnreadable = Math.max(0, Math.trunc(numberOrZero(payload?.unreadable)));
        state.libraryError = null;
      } catch (error) {
        state.libraryError = error?.message || "library unavailable";
      }
      syncFocusedRunSelection();
      renderTop();
    }

      if (state.panelOpen) {
        if (event.key === "Escape") { event.preventDefault(); closeRunPanel(); return; }
        if (event.key === "Tab") { const focusable=[...els.slideRoot.querySelectorAll("button:not(:disabled),textarea:not(:disabled),select:not(:disabled),[href],[tabindex]:not([tabindex='-1'])")]; if(!focusable.length)return; const first=focusable[0],last=focusable[focusable.length-1]; if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();} }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") { const lanes=[...els.slideRoot.querySelectorAll(".slide-lane")]; const index=lanes.indexOf(document.activeElement); if(index>=0){event.preventDefault();lanes[(index+(event.key==="ArrowDown"?1:-1)+lanes.length)%lanes.length].click();} }
        return;
      }
    });

    renderTop();
    // Honour the restored view rather than forcing Runs, or the URL param and
    // the stored preference are both silently discarded at boot.
    setShellView(state.shellView);
    fetchRuns();
    fetchLibrary();
    setInterval(fetchRuns, 1000);
    setInterval(fetchLibrary, 2000);
    setInterval(() => { if (state.modelsFetched) fetchModels(true); }, 30000);
  })();
  </script>
</body>
</html>
