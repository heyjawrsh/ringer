    async function submitPilotDecision(run, decision, note = "") {
      const current = state.pilotDecisions.get(run.__id);
      if (current?.inFlight || current?.result) return;
      const cleanNote = String(note || "").trim();
      if (decision === "revise" && !cleanNote) return;
      if (decision === "reject" && !window.confirm("Reject this pilot and end the run?")) return;
      state.pilotDecisions.set(run.__id, {inFlight: true, decision, error: "", result: "", revisions: numberOrZero(run.pilot?.revisions)});
      renderLive();
      try {
        const response = await fetch("/api/pilot/decision", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(decision === "revise"
            ? {run_id: run.__id, decision, note: cleanNote}
            : {run_id: run.__id, decision})
        });
        let payload = {};
        try { payload = await response.json(); } catch (_error) {}
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        state.pilotDecisions.set(run.__id, {
          inFlight: false,
          decision,
          error: "",
          result: String(payload.decision || decision),
          revisions: numberOrZero(run.pilot?.revisions)
        });
        if (decision === "revise") state.pilotNotes.delete(run.__id);
      } catch (error) {
        state.pilotDecisions.set(run.__id, {
          inFlight: false,
          decision,
          error: error?.message || "could not reach Ringside",
          result: ""
        });
      }
      renderLive();
      renderRunsOverview();
      if (state.shellView === "reviews") renderReviewsView();
      if (state.shellView === "lanes") renderLanesView();
    }

    function renderLaneWall(staging) {
      const liveRuns = runningNowRuns();
      const fallback = liveRuns.length
        ? null
        : [...state.runs].sort((left, right) => left.__index - right.__index)[0] || null;
      const wallRuns = liveRuns.length ? liveRuns : (fallback ? [fallback] : []);
      const entries = wallRuns.flatMap(run => run.tasks.map((task, taskIndex) => {
        const kind = taskKind(task);
        const review = run.pilot?.status === "awaiting";
        const reviewText = run.orchestrator_alive === false ? "pilot review abandoned" : "pilot review needed";
        const attention = kind === "fail" || review;
        const rank = attention ? 0 : (kind === "pass" ? 2 : 1);
        return {run, task, taskIndex, key: taskKey(task, taskIndex), kind, review, reviewText, attention, rank};
      }));
      entries.sort((left, right) => {
        if (left.rank !== right.rank) return left.rank - right.rank;
        const byProject = projectInfo(left.run).name.localeCompare(projectInfo(right.run).name);
        if (byProject) return byProject;
        const byRun = left.run.run_name.localeCompare(right.run.run_name);
        if (byRun) return byRun;
        const byLane = left.key.localeCompare(right.key);
        if (byLane) return byLane;
        return left.run.__id.localeCompare(right.run.__id);
      });

      const censusEntries = liveRuns.length ? entries : [];
      const working = censusEntries.filter(entry => taskIsRunning(entry.task)).length;
      const attention = censusEntries.filter(entry => entry.attention).length;
      const plural = (count, singular, pluralValue = `${singular}s`) => count === 1 ? singular : pluralValue;

      const wall = document.createElement("section");
      wall.className = "lane-wall";
      wall.dataset.key = "lane-wall";
      wall.setAttribute("aria-labelledby", "lane-wall-title");
      const head = document.createElement("div");
      head.className = "lane-wall-head";
      const title = document.createElement("h2");
      title.id = "lane-wall-title";
      title.textContent = "Lane wall";
      const census = document.createElement("p");
      census.className = "lane-census mono";
      census.setAttribute("role", "status");
      // With nothing live the wall shows a fallback run, so a live-only census
      // would read "0 lanes need attention" directly above a failed card. Count
      // what is actually on screen instead.
      const shown = liveRuns.length ? censusEntries : entries;
      const shownAttention = shown.filter(entry => entry.attention).length;
      census.textContent = liveRuns.length
        ? `${liveRuns.length} ${plural(liveRuns.length, "swarm")} live · ${working} ${plural(working, "lane")} working · ${attention} ${plural(attention, "lane")} ${attention === 1 ? "needs" : "need"} attention.`
        : `Nothing live · ${shown.length} ${plural(shown.length, "lane")} shown · ${shownAttention} ${plural(shownAttention, "lane")} ${shownAttention === 1 ? "needs" : "need"} attention.`;
      head.append(title, census);
      wall.appendChild(head);

      if (!liveRuns.length) {
        const note = document.createElement("p");
        note.className = "lane-wall-note";
        note.textContent = fallback
          ? `Nothing is live. Showing the most recently updated run, ${fallback.run_name}.`
          : "Nothing is live. No lanes have reported in yet.";
        wall.appendChild(note);
      }

      const workers = document.createElement("div");
      workers.className = "workers";
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = wallRuns.length ? "No workers have reported in yet." : "Start something with: ./ringer.py run manifest.json";
        workers.appendChild(empty);
      }
      entries.forEach(entry => {
        const {run, task, key, kind, review, reviewText} = entry;
        const card = document.createElement("article");
        card.className = "worker-card wall-card";
        card.dataset.key = `wall-worker:${expansionKey(run.__id, key)}`;

        const button = document.createElement("button");
        button.className = "worker-card-toggle";
        button.type = "button";
        button.addEventListener("click", () => focusRun(run.__id));

        const glyph = document.createElement("span");
        glyph.className = `glyph ${kind}`;
        glyph.setAttribute("aria-hidden", "true");
        const lane = document.createElement("span");
        lane.className = "wall-lane";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = key;
        const runName = document.createElement("span");
        runName.className = "run-name";
        const project = projectInfo(run);
        runName.textContent = `${project.name} / ${run.run_name}${review ? ` · ${reviewText}` : ""}`;
        runName.title = project.path;
        lane.append(name, runName);
        const cardHead = document.createElement("span");
        cardHead.className = "worker-card-head";
        cardHead.append(lane, glyph);

        const taskState = document.createElement("span");
        taskState.className = `state ${kind}`;
        taskState.textContent = taskStateText(kind);
        const engine = String(task.engine || "").trim() || "engine not reported";
        const model = String(task.model || "").trim() || "model not reported";
        const metaParts = [`${engine} · ${model}`, formatDuration(task.elapsed_s)];
        const meta = document.createElement("span");
        meta.className = "meta mono";
        meta.textContent = metaParts.join(" · ");
        const reviewLabel = review ? `, ${reviewText}` : "";
        button.setAttribute("aria-label", `${key} in ${project.name}, ${run.run_name}, ${taskStateText(kind)}${reviewLabel}, ${metaParts.join(", ")}. Open single-run view.`);
        if (hasBuildMismatch(run)) button.title = "Warning: this run was produced by a different Ringer build than this page is serving.";
        button.append(cardHead, taskState, meta);

        const activityText = taskIsRunning(task) ? (taskActivity(task) || "No activity reported yet.") : "";
        if (activityText) {
          const activity = document.createElement("span");
          activity.className = "activity";
          activity.textContent = activityText;
          button.appendChild(activity);
        }
        card.appendChild(button);
        workers.appendChild(card);
      });
      wall.appendChild(workers);
      staging.appendChild(wall);
    }

    function renderLive() {
      const staging = document.createElement("div");
      renderPilotBanner();
      if (state.view === "lanes") {
        renderLaneWall(staging);
        state.rendering = true;
        preserveScroll(() => { morphChildren(els.runs, staging); });
        state.rendering = false;
        syncLogPolling();
        return;
      }
      if (!state.runs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nothing has run yet. Start something with: ./ringer.py run manifest.json";
        staging.appendChild(empty);
        state.rendering = true;
        preserveScroll(() => { morphChildren(els.runs, staging); });
        state.rendering = false;
        syncLogPolling();
        return;
      }

      const selectedName = state.artifactName;
      const visibleRuns = selectedName ? state.runs.filter(run => run.run_name === selectedName) : state.runs;
      const roundOrder = [...visibleRuns].sort((a, b) => parseTime(a.started_at) - parseTime(b.started_at));
      const roundOf = run => roundOrder.indexOf(run) + 1;
      if (!visibleRuns.length) {
        const note = document.createElement("p");
        note.className = "empty-note";
        note.textContent = "No agent activity recorded for this artifact yet.";
        staging.appendChild(note);
      }
      const groups = new Map();
      visibleRuns.forEach(run => {
        const project = projectInfo(run);
        if (!groups.has(project.key)) groups.set(project.key, {project, runs: []});
        groups.get(project.key).runs.push(run);
      });
      let renderedRunIndex = 0;
      groups.forEach(group => {
        const projectSection = document.createElement("section");
        projectSection.className = "project-group";
        projectSection.dataset.key = `project:${group.project.key}`;
        projectSection.setAttribute("aria-label", group.project.name);
        const projectHead = document.createElement("h2");
        projectHead.className = "project-head";
        projectHead.title = group.project.path;
        const projectLabel = document.createElement("span");
        projectLabel.textContent = "Project";
        const projectName = document.createElement("b");
        projectName.textContent = group.project.name;
        const projectCount = document.createElement("span");
        projectCount.className = "project-count";
        projectCount.textContent = `${group.runs.length} run${group.runs.length === 1 ? "" : "s"}`;
        projectHead.append(projectLabel, projectName, projectCount);
        projectSection.appendChild(projectHead);
        group.runs.forEach(run => {
        const runIndex = renderedRunIndex;
        renderedRunIndex += 1;
        const section = document.createElement("details");
        section.className = `run ${run.state}`;
        section.dataset.key = run.__id;
        const preferred = state.runOpen[run.__id];
        const awaitingPilot = runIsRunningNow(run) && run.pilot?.status === "awaiting";
        section.open = awaitingPilot || (preferred !== undefined ? preferred : (run.state === "live" || runIndex === 0));
        section.addEventListener("toggle", () => {
          if (!state.rendering) state.runOpen[run.__id] = section.open;
        });

        const head = document.createElement("summary");
        head.className = "corner run-head";
        const dot = document.createElement("span");
        dot.className = `live-dot ${runIsRunningNow(run) ? "live" : ""}`;
        dot.setAttribute("aria-hidden", "true");
        const title = document.createElement("span");
        title.className = "eyebrow";
        const titleBold = document.createElement("b");
        titleBold.textContent = run.run_name;
        title.appendChild(titleBold);
        const identity = document.createElement("span");
        identity.className = "identity";
        identity.textContent = `Round ${roundOf(run)} · ${run.identity}`;
        const stats = document.createElement("span");
        stats.className = "clock mono run-stats";
        const outcome = run.state === "live"
          ? `${Math.min(run.tasks.length, run.done)}/${run.tasks.length} done`
          : (run.fail > 0 ? `${run.pass} passed · ${run.fail} failed` : `all ${run.pass} passed`);
        const tok = run.tokens > 0 ? ` · ${formatTokens(run.tokens)}` : "";
        stats.textContent = `${outcome} · ${formatDuration(run.elapsed_s)}${tok}`;
        head.append(dot, title, identity);
        if (hasBuildMismatch(run)) {
          const badge = document.createElement("span");
          badge.className = "build-badge";
          badge.textContent = "build mismatch";
          badge.title = `Run build ${run.ringer_version}; served build ${state.serverVersion}`;
          head.appendChild(badge);
        }
        head.appendChild(stats);
        section.appendChild(head);
        appendBuildWarning(section, run);

        const rounds = document.createElement("div");
        rounds.className = "rounds";
        const counts = {pass: 0, working: 0, retry: 0, waiting: 0, fail: 0};
        run.tasks.forEach((task, index) => {
          const kind = taskKind(task);
          counts[kind] += 1;
          const span = document.createElement("span");
          span.className = kind;
          span.setAttribute("aria-hidden", "true");
          span.dataset.taskKey = taskKey(task, index);
          rounds.appendChild(span);
        });
        rounds.setAttribute("role", "img");
        rounds.setAttribute(
          "aria-label",
          `${run.tasks.length} workers: ${counts.pass} finished, ${counts.working} working, ${counts.retry} sent back, ${counts.waiting} waiting, ${counts.fail} failed`
        );
        section.appendChild(rounds);

        const workers = document.createElement("div");
        workers.className = "workers";
        if (!run.tasks.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No workers have reported in yet.";
          workers.appendChild(empty);
        }
        run.tasks.forEach((task, taskIndex) => {
          const key = taskKey(task, taskIndex);
          const kind = taskKind(task);
          const expandedKey = expansionKey(run.__id, key);
          const expanded = state.expanded.get(expandedKey);
          const isExpanded = Boolean(expanded);
          const card = document.createElement("article");
          card.className = `worker-card${isExpanded ? " expanded" : ""}`;
          card.dataset.key = `worker:${key}`;

          const toggle = document.createElement("button");
          toggle.className = "worker-card-toggle";
          toggle.type = "button";
          toggle.setAttribute("aria-expanded", String(isExpanded));
          if (isExpanded) toggle.setAttribute("aria-controls", `stream-${runIndex}-${taskIndex}`);
          toggle.addEventListener("click", () => toggleWorker(run.__id, key));

          const glyph = document.createElement("span");
          glyph.className = `glyph ${kind}`;
          glyph.setAttribute("aria-hidden", "true");
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = key;
          const cardHead = document.createElement("span");
          cardHead.className = "worker-card-head";
          cardHead.append(name, glyph);
          const taskState = document.createElement("span");
          taskState.className = `state ${kind}`;
          taskState.textContent = taskStateText(kind);
          const engine = String(task.engine || "").trim() || "engine not reported";
          const model = String(task.model || "").trim();
          const metaParts = [model ? `${engine} · ${model}` : engine];
          metaParts.push(kind === "waiting" ? "—" : formatDuration(task.elapsed_s));
          const attempts = numberOrZero(task.attempts);
          if (attempts > 1) metaParts.push(`attempt ${attempts}`);
          if (numberOrZero(task.tokens) > 0) metaParts.push(formatTokens(task.tokens));
          const meta = document.createElement("span");
          meta.className = "meta mono";
          meta.textContent = metaParts.join(" · ");
          toggle.setAttribute("aria-label", `${key}, ${taskStateText(kind)}, ${metaParts.join(", ")}`);
          toggle.append(cardHead, taskState, meta);
          const activityText = taskIsRunning(task) ? (taskActivity(task) || "No activity reported yet.") : "";
          if (activityText) {
            const activity = document.createElement("span");
            activity.className = "activity";
            activity.textContent = activityText;
            toggle.appendChild(activity);
          }
          card.appendChild(toggle);

          const violations = Array.isArray(task.violations)
            ? task.violations.map(violationParts)
            : [];
          if (violations.length) {
            const list = document.createElement("ul");
            list.className = "violations";
            list.setAttribute("aria-label", `${violations.length} task violation${violations.length === 1 ? "" : "s"}`);
            violations.forEach(violation => {
              const item = document.createElement("li");
              const label = document.createElement("b");
              const kind = violation.kind === "ownership"
                ? "Ownership"
                : (violation.kind === "contract" ? "Contract" : "Recorded");
              label.textContent = `${kind} violation:`;
              item.append(label, document.createTextNode(` ${violation.detail}`));
              list.appendChild(item);
            });
            card.appendChild(list);
          }

          if (expanded) {
            const stream = renderStream(run, task, taskIndex, expanded, expandedKey);
            stream.id = `stream-${runIndex}-${taskIndex}`;
            card.appendChild(stream);
          }
          workers.appendChild(card);
        });
        section.appendChild(workers);
        projectSection.appendChild(section);
        section.setAttribute("aria-label", `${group.project.name}: ${run.run_name}`);
        });
        staging.appendChild(projectSection);
      });

      state.rendering = true;
      preserveScroll(() => { morphChildren(els.runs, staging); });
      state.rendering = false;
      syncLogPolling();
    }

    function renderStream(run, task, taskIndex, expanded, expandedKey) {
      const panel = document.createElement("div");
      panel.className = "stream";
      panel.dataset.stream = "true";
      panel.dataset.key = `stream:${taskKey(task, taskIndex)}`;
      panel.dataset.expansionKey = expandedKey;

      // The brief: the exact prompt this model was handed, plus the pass
      // test that will judge its work. Watchers should never have to guess
      // what an agent was asked to do.
      const brief = document.createElement("details");
      brief.className = "brief";
      const briefSummary = document.createElement("summary");
      briefSummary.textContent = "What it was asked to do";
      brief.appendChild(briefSummary);
      const briefPre = document.createElement("pre");
      briefPre.textContent = String(task.spec || "").trim() || "No brief was recorded for this worker.";
      brief.appendChild(briefPre);
      const check = String(task.check || "").trim();
      if (check) {
        const checkLine = document.createElement("p");
        checkLine.className = "brief-check mono";
        checkLine.textContent = `Pass test: ${check}`;
        brief.appendChild(checkLine);
      }
      panel.appendChild(brief);

      const head = document.createElement("div");
      head.className = "stream-head mono";
      const title = document.createElement("span");
      title.textContent = "Live work stream";
      const engineTag = document.createElement("span");
      const model = String(task.model || "").trim();
      const engineName = String(task.engine || "").trim();
      engineTag.textContent = model ? `${engineName || "engine"} · ${model}` : engineName;
      const meta = document.createElement("span");
      const attempts = numberOrZero(task.attempts);
      const attemptNote = attempts > 1 ? `attempt ${attempts} · ` : "";
      meta.textContent = attemptNote + (taskIsRunning(task) ? "polling every 1s" : "final snapshot");
      head.append(title, engineTag, meta);
      panel.appendChild(head);

      const pre = document.createElement("pre");
      pre.className = "stream-log";
      pre.tabIndex = 0;
      pre.textContent = expanded.logText || "No log output yet.";
      pre.addEventListener("scroll", () => {
        const distance = pre.scrollHeight - pre.scrollTop - pre.clientHeight;
        if (state.expanded.get(expandedKey) === expanded) {
          expanded.pinned = distance < 28;
          expanded.scrollTop = pre.scrollTop;
        }
      });
      panel.appendChild(pre);
      if (expanded.error) {
        const error = document.createElement("p");
        error.className = "catch";
        const bold = document.createElement("b");
        bold.textContent = "Log stream unavailable:";
        error.append(bold, document.createTextNode(` ${expanded.error}`));
        panel.appendChild(error);
      }

      // Once the check has run, close the trust loop right here: what the
      // check proved, and the raw output it printed while proving it.
      const kind = taskKind(task);
      if (kind === "pass" || kind === "fail") {
        const verified = String(task.verified || "").trim();
        const proofTail = String(task.check_output_tail || "").trim();
        if (verified || proofTail) {
          const verdict = document.createElement("div");
          verdict.className = "verdict";
          if (verified) {
            const how = document.createElement("p");
            how.className = "how";
            const label = document.createElement("b");
            label.textContent = kind === "pass" ? "How it was checked:" : "What the check demanded:";
            how.append(label, document.createTextNode(` ${verified}`));
            verdict.appendChild(how);
          }
          if (proofTail) {
            const proof = document.createElement("details");
            const proofSummary = document.createElement("summary");
            proofSummary.textContent = kind === "pass" ? "See the proof" : "See why it failed";
            proof.appendChild(proofSummary);
            const proofPre = document.createElement("pre");
            proofPre.textContent = proofTail;
            proof.appendChild(proofPre);
            verdict.appendChild(proof);
          }
          panel.appendChild(verdict);
        }
      }
      requestAnimationFrame(() => {
        if (expanded.pinned !== false) {
          pre.scrollTop = pre.scrollHeight;
        } else {
          pre.scrollTop = expanded.scrollTop || 0;
        }
      });
      return panel;
    }

    function toggleWorker(runIdValue, taskKeyValue) {
      const key = expansionKey(runIdValue, taskKeyValue);
      if (state.expanded.has(key)) {
        closeWorker(key);
        return;
      }
      state.expanded.set(key, {
        runId: runIdValue,
        taskKey: taskKeyValue,
        logText: "",
        error: "",
        pinned: true,
        scrollTop: 0,
        finalFetched: false
      });
      renderLive();
      const found = findExpandedTask(state.expanded.get(key));
      if (found && taskIsRunning(found.task)) fetchExpandedLog(key);
    }

    function closeWorker(key) {
      if (key) state.expanded.delete(key);
      else state.expanded.clear();
      if (!hasRunningExpandedTasks() && state.logTimer) {
        clearInterval(state.logTimer);
        state.logTimer = null;
      }
      renderLive();
    }

    function findExpandedTask(expanded) {
      if (!expanded) return null;
      const run = state.runs.find(item => item.__id === expanded.runId);
      if (!run) return null;
      const index = run.tasks.findIndex((task, taskIndex) => taskKey(task, taskIndex) === expanded.taskKey);
      if (index < 0) return null;
      return {run, task: run.tasks[index], index};
    }

    async function fetchExpandedLog(key) {
      const expanded = state.expanded.get(key);
      const found = findExpandedTask(expanded);
      if (!expanded || !found) return;
      const path = `/logs/${encodeURIComponent(found.run.__id)}/${encodeURIComponent(expanded.taskKey)}`;
      try {
        const response = await fetch(path, {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const raw = await response.text();
        // Worker logs carry raw terminal output; strip ANSI escapes for the stream view.
        const text = raw.replace(/\[[0-9;?]*[ -\/]*[@-~]/g, "").replace(/\[[0-9;]{1,6}m/g, "");
        if (state.expanded.get(key) !== expanded) return;
        expanded.logText = text || "No log output yet.";
        expanded.error = "";
        updateStreamText(key, expanded.logText);
        updatePanelStreamText(key, expanded.logText);
      } catch (error) {
        if (state.expanded.get(key) !== expanded) return;
        expanded.error = error?.message || "could not read log";
        renderLive();
        if (key === panelExpansionKey()) renderRunPanel();
      }
    }

    function updateStreamText(key, text) {
      const stream = [...els.runs.querySelectorAll(".stream[data-expansion-key]")]
        .find(item => item.dataset.expansionKey === key);
      const pre = stream?.querySelector("pre.stream-log");
      if (!pre) return;
      const expanded = state.expanded.get(key);
      if (!expanded) return;
      const shouldPin = expanded.pinned !== false || pre.scrollHeight - pre.scrollTop - pre.clientHeight < 28;
      const scrollTop = pre.scrollTop;
      pre.textContent = text || "No log output yet.";
      if (shouldPin) {
        pre.scrollTop = pre.scrollHeight;
      } else {
        pre.scrollTop = scrollTop;
        expanded.scrollTop = scrollTop;
      }
    }

    function updatePanelStreamText(key, text) {
      const pre=[...els.slideRoot.querySelectorAll("pre.slide-log[data-expansion-key]")].find(item=>item.dataset.expansionKey===key); const expanded=state.expanded.get(key); if(!pre||!expanded)return; const shouldPin=expanded.pinned!==false||pre.scrollHeight-pre.scrollTop-pre.clientHeight<28; const scrollTop=pre.scrollTop; pre.textContent=text||"No log output yet."; if(shouldPin)pre.scrollTop=pre.scrollHeight;else{pre.scrollTop=scrollTop;expanded.scrollTop=scrollTop;}
    }

    function hasRunningExpandedTasks() {
      return [...state.expanded.values()].some(expanded => {
        const found = findExpandedTask(expanded);
        return found && taskIsRunning(found.task);
      });
    }

    function fetchExpandedLogs() {
      [...state.expanded.entries()].forEach(([key, expanded]) => {
        const found = findExpandedTask(expanded);
        if (found && taskIsRunning(found.task)) fetchExpandedLog(key);
      });
    }

    function syncLogPolling() {
      [...state.expanded.entries()].forEach(([key, expanded]) => {
        const found = findExpandedTask(expanded);
        if (!found) {
          state.expanded.delete(key);
          return;
        }
        if (taskIsRunning(found.task)) expanded.finalFetched = false;
        if (!taskIsRunning(found.task) && !expanded.finalFetched) {
          expanded.finalFetched = true;
          fetchExpandedLog(key);
        }
      });
      const hasRunning = hasRunningExpandedTasks();
      if (hasRunning && !state.logTimer) {
        state.logTimer = setInterval(fetchExpandedLogs, 1000);
      }
      if (!hasRunning && state.logTimer) {
        clearInterval(state.logTimer);
        state.logTimer = null;
      }
    }

    function normalizeArtifactState(value) {
      const text = String(value || "").toLowerCase();
      if (text === "live") return "live";
      if (text === "pass" || text === "finished") return "pass";
      if (text === "fail") return "fail";
      if (text === "died") return "died";
      return "unknown";
    }

    function artifactStateClass(value) {
      const normalized = normalizeArtifactState(value);
      return normalized === "died" ? "fail" : normalized;
    }

    function artifactVersionKey(version, index) {
      return String(version.path || version.run_id || `${version.finished_at || ""}-${version.outcome || ""}-${index}`);
    }

    function normalizeLibrary(payload) {
      const artifacts = payload?.artifacts && typeof payload.artifacts === "object" && !Array.isArray(payload.artifacts)
        ? payload.artifacts
        : {};
      return Object.entries(artifacts).map(([name, entry]) => {
        const item = entry && typeof entry === "object" ? entry : {};
        const versions = Array.isArray(item.versions) ? item.versions : [];
        const normalizedVersions = versions.map((version, index) => {
          const value = version && typeof version === "object" ? version : {};
          return {
            key: artifactVersionKey(value, index),
            run_id: String(value.run_id || ""),
            path: String(value.path || ""),
            finished_at: String(value.finished_at || ""),
            finishedTs: parseTime(value.finished_at),
            outcome: normalizeArtifactState(value.outcome),
            tasks_pass: numberOrZero(value.tasks_pass),
            tasks_fail: numberOrZero(value.tasks_fail)
          };
        }).sort((left, right) => right.finishedTs - left.finishedTs);
        const updatedAt = String(item.updated_at || "");
        const updatedTs = parseTime(updatedAt) || normalizedVersions[0]?.finishedTs || 0;
        const keyText = String(name || "artifact");
        return {
          name: keyText,
          // The key carries a `<project-slug>:` prefix for namespacing; that is
          // plumbing, not something a human should have to read.
          label: keyText.includes(":") ? keyText.slice(keyText.indexOf(":") + 1) : keyText,
          project: String(item.project || ""),
          live_path: String(item.live_path || ""),
          state: normalizeArtifactState(item.state),
          identity: String(item.identity || "unknown"),
          current_run_id: String(item.current_run_id || ""),
          updated_at: updatedAt,
          updatedTs,
          versions: normalizedVersions
        };
      }).filter(item => item.name).sort((left, right) => {
        const leftLive = left.state === "live" ? 1 : 0;
        const rightLive = right.state === "live" ? 1 : 0;
        if (leftLive !== rightLive) return rightLive - leftLive;
        // Stable within each group: two live runs must never swap rows as
        // their "updated Ns ago" leapfrogs every flush (demo-night lesson).
        return left.name.localeCompare(right.name);
      });
    }

    function sanitizeArtifactName(value) {
      return String(value || "artifact").replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^[.-]+|[.-]+$/g, "") || "artifact";
    }

    function artifactLiveHref(name) {
      return `/artifacts/live/${encodeURIComponent(sanitizeArtifactName(name))}.html`;
    }

    function artifactPathHref(path) {
      const text = String(path || "").replace(/\\/g, "/");
      const marker = "/artifacts/";
      const index = text.lastIndexOf(marker);
      const relative = index >= 0
        ? text.slice(index + marker.length)
        : text.replace(/^\/+/, "").replace(/^artifacts\//, "");
      const parts = relative.split("/").filter(Boolean).map(encodeURIComponent);
      return parts.length ? `/artifacts/${parts.join("/")}` : "";
    }

    function newestArtifact() {
      const live = state.artifacts.filter(item => item.state === "live").sort((left, right) => right.updatedTs - left.updatedTs);
      return live[0] || [...state.artifacts].sort((left, right) => right.updatedTs - left.updatedTs)[0] || null;
    }

    function selectedArtifact() {
      return state.artifacts.find(item => item.name === state.artifactName) || null;
    }

    function syncArtifactSelection() {
      if (!state.artifacts.length) {
        state.artifactName = "";
        state.artifactVersion = "live";
        return;
      }
      const current = selectedArtifact();
      if (state.artifactManual && current) {
        if (state.artifactVersion !== "live" && !current.versions.some(version => version.key === state.artifactVersion)) {
          state.artifactVersion = "live";
        }
        return;
      }
      if (state.artifactManual && !current) {
        state.artifactManual = false;
        sessionStorage.removeItem(ARTIFACT_KEY);
      }
      // Only choose FOR the user when nothing is on screen yet. A new live
      // run must never steal the view mid-review (demo-night lesson).
      if (current) return;
      const target = newestArtifact();
      if (target) {
        state.artifactName = target.name;
        state.artifactVersion = "live";
      }
    }

    function selectedArtifactTarget() {
      const artifact = selectedArtifact();
      if (!artifact) return null;
      if (state.artifactVersion !== "live") {
        const version = artifact.versions.find(item => item.key === state.artifactVersion);
        if (version) {
          const src = artifactPathHref(version.path);
          return {
            artifact,
            version,
            src,
            key: `${src}|version|${version.key}`
          };
        }
      }
      // Library keys are namespaced by project (`<project-slug>:<run_name>`), so
      // they are NOT a path component. Prefer the entry's recorded live_path;
      // fall back to the flat name for entries written before namespacing.
      const src = artifact.live_path
        ? artifactPathHref(artifact.live_path)
        : artifactLiveHref(artifact.label);
      return {
        artifact,
        version: null,
        src,
        key: `${src}|current|${artifact.state}`
      };
    }

    function renderArtifacts() {
      syncArtifactSelection();
      let options;
      if (!state.artifacts.length) {
        options = [{value: "", text: state.libraryError ? "Ringside reconnecting…" : "No artifacts yet"}];
      } else {
        options = state.artifacts.map(artifact => {
          const marker = artifact.state === "live" ? "● " : "";
          // Two projects may each have a run called "build", so the project has
          // to ride along in the label or the picker is ambiguous.
          const projectName = artifact.project
            ? artifact.project.replace(/\/+$/, "").split("/").pop()
            : "";
          const scope = projectName ? `${projectName} / ` : "";
          return {
            value: artifact.name,
            text: `${marker}${scope}${artifact.label} — ${artifact.state === "live" ? "live" : artifact.state} · updated ${relativeAgo(artifact.updated_at)}`
          };
        });
      }
      syncSelect(els.artifactPicker, options, state.artifacts.length ? state.artifactName : "");
      els.artifactPicker.disabled = !state.artifacts.length;
    }

    function renderArtifactControls() {
      const artifact = selectedArtifact();
      if (!artifact) {
        els.artifactStatus.textContent = state.libraryError ? "reconnecting…" : "No artifact selected.";
        syncSelect(els.artifactVersion, []);
        els.artifactVersion.disabled = true;
        return;
      }

      els.artifactStatus.textContent = artifact.state === "live"
        ? "live — updating"
        : `finished ${relativeAgo(artifact.updated_at)}`;
      const options = [{
        value: "live",
        text: artifact.state === "live"
          ? "Now — live, updating"
          : `Now — finished ${relativeAgo(artifact.updated_at)}`
      }];
      const total = artifact.versions.length;
      artifact.versions.forEach((version, index) => {
        const outcome = version.tasks_fail > 0
          ? `${version.tasks_pass} passed, ${version.tasks_fail} failed`
          : `all ${version.tasks_pass} passed`;
        options.push({
          value: version.key,
          text: `Round ${total - index} — ${outcome} · ${formatVersionTime(version.finished_at)}`
        });
      });
      syncSelect(els.artifactVersion, options, state.artifactVersion);
      els.artifactVersion.disabled = false;
    }

    function formatVersionTime(value) {
      const stamp = parseTime(value);
      if (!stamp) return "unknown";
      return new Date(stamp).toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function showArtifactMessage(message) {
      els.frameWrap.replaceChildren();
      const line = document.createElement("div");
      line.className = "artifact-error";
      line.textContent = message;
      els.frameWrap.appendChild(line);
    }

    async function loadArtifactFrame(force) {
      if (state.view === "lanes") return;
      const target = selectedArtifactTarget();
      if (!target?.src) {
        state.frameKey = "";
        showArtifactMessage(state.artifacts.length ? "Artifact path unavailable." : "No artifacts yet.");
        return;
      }
      const isLive = target.artifact.state === "live" && !target.version;
      if (!force && state.frameKey === target.key && !isLive) return;
      const request = ++state.frameRequest;
      try {
        const response = await fetch(target.src, {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const raw = await response.text();
        if (request !== state.frameRequest) return;
        // The live page carries a meta refresh for standalone viewing; inside
        // this pane WE are the refresher — strip it and swap content only on
        // change, so nothing ever flashes.
        let html = raw.replace(/<meta[^>]+http-equiv=["']?refresh["']?[^>]*>/gi, "");
        // srcdoc documents have no base URL: without this, every relative
        // deliverable/work-log link 404s. Resolve against the fetched URL and
        // open results in a new tab so the pane never navigates away.
        const baseHref = new URL(target.src, window.location.href).href;
        html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${baseHref}" target="_blank">`);
        if (state.frameKey === target.key && state.frameContent === html) return;
        let frame = els.frameWrap.querySelector("iframe");
        const sameDoc = frame && state.frameKey === target.key;
        if (sameDoc && frame.contentDocument?.documentElement) {
          // Same artifact, new content: patch the live document in place.
          // Resetting srcdoc tears the whole page down — that teardown IS
          // the blink, and it also loses the reader's place and any open
          // disclosure. Morph touches only what changed.
          try {
            const next = new DOMParser().parseFromString(html, "text/html");
            morphNode(frame.contentDocument.documentElement, next.documentElement);
            sizeFrame(frame);
            state.frameContent = html;
            return;
          } catch (_e) { /* fall through to a full reload */ }
        }
        const keepScroll = sameDoc ? (window.scrollY || 0) : 0;
        if (!frame || !sameDoc) {
          frame = document.createElement("iframe");
          frame.title = `Artifact: ${target.artifact.label || target.artifact.name}`;
          els.frameWrap.replaceChildren(frame);
        }
        frame.addEventListener("load", () => {
          try {
            const doc = frame.contentDocument;
            sizeFrame(frame);
            doc.documentElement.style.overflowY = "hidden";
            if (keepScroll) window.scrollTo(0, keepScroll);
          } catch (_e) {}
        }, {once: true});
        frame.srcdoc = html;
        state.frameKey = target.key;
        state.frameContent = html;
      } catch (_error) {
        if (request !== state.frameRequest) return;
        state.frameKey = "";
        state.frameContent = "";
        showArtifactMessage("Could not load this artifact.");
      }
    }

    async function fetchRuns() {
      try {
        const response = await fetch("/api/runs", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.runs = normalizeRuns(payload);
        state.serverVersion = String(payload?.server?.ringer_version || "").trim();
        state.runUnreadable = Math.max(0, Math.trunc(numberOrZero(payload?.unreadable)));
        state.active = payload?.active || {};
        state.update = payload?.update || null;
        state.runError = null;
        if (state.restoreRunFromUrl) {
          state.restoreRunFromUrl = false;
          const requested = state.runs.find(run => run.__id === state.focusedRunId);
          if (requested) {
            state.artifactName = requested.run_name;
            state.artifactManual = true;
            state.artifactVersion = "live";
            state.runOpen[requested.__id] = true;
            sessionStorage.setItem(ARTIFACT_KEY, requested.run_name);
          } else {
            state.focusedRunId = "";
          }
          replaceUrlState();
        }
        syncFocusedRunSelection();
      } catch (error) {
        state.runError = error?.message || "runs unavailable";
      }
      renderTop();
      renderUpdateBanner();
      renderUnreadableNotice();
      renderRunningNow();
      renderLive();
    }

    async function fetchLibrary() {
      try {
        const response = await fetch("/api/library", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.artifacts = normalizeLibrary(payload);
        state.libraryUnreadable = Math.max(0, Math.trunc(numberOrZero(payload?.unreadable)));
        state.libraryError = null;
      } catch (error) {
        state.libraryError = error?.message || "library unavailable";
      }
      renderTop();
      renderUnreadableNotice();
      renderArtifacts();
      renderArtifactControls();
      syncFocusedRunSelection();
      renderRunningNow();
      loadArtifactFrame(false);
    }
    els.artifactVersion.addEventListener("change", () => {
      state.artifactVersion = els.artifactVersion.value || "live";
      state.frameKey = "";
      renderArtifactControls();
      loadArtifactFrame(true);
    });
    els.viewSwitch.addEventListener("click", event => {
      const button = event.target.closest("button[data-view]");
      if (button && els.viewSwitch.contains(button)) setView(button.dataset.view);
    });
    document.getElementById("open-folder").addEventListener("click", () => {
      const artifact = selectedArtifact();
      if (!artifact) return;
      const version = state.artifactVersion !== "live"
        ? artifact.versions.find(item => item.key === state.artifactVersion)
        : null;
      const runId = version ? version.run_id : (artifact.current_run_id || "");
      openArtifactFolder(artifact, runId);
    });

    els.artifactPicker.addEventListener("change", () => {
      const name = els.artifactPicker.value;
      if (!name) return;
      state.artifactName = name;
      state.artifactManual = true;
      state.artifactVersion = "live";
      state.frameKey = "";
      sessionStorage.setItem(ARTIFACT_KEY, name);
      state.focusedRunId = "";
      syncFocusedRunSelection();
      renderArtifacts();
      renderArtifactControls();
      renderRunningNow();
      renderLive();
      loadArtifactFrame(true);
    });
    document.querySelector(".rail-nav").addEventListener("click", event => {
      const button=event.target.closest("[data-shell-view]"); if(button)setShellView(button.dataset.shellView);
    });
    document.addEventListener("keydown", event => {
      if (state.panelOpen) {
        if (event.key === "Escape") { event.preventDefault(); closeRunPanel(); return; }
        if (event.key === "Tab") { const focusable=[...els.slideRoot.querySelectorAll("button:not(:disabled),textarea:not(:disabled),select:not(:disabled),[href],[tabindex]:not([tabindex='-1'])")]; if(!focusable.length)return; const first=focusable[0],last=focusable[focusable.length-1]; if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();} }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") { const lanes=[...els.slideRoot.querySelectorAll(".slide-lane")]; const index=lanes.indexOf(document.activeElement); if(index>=0){event.preventDefault();lanes[(index+(event.key==="ArrowDown"?1:-1)+lanes.length)%lanes.length].click();} }
        return;
      }
      if (event.key === "Escape" && state.expanded.size) closeWorker();
    });

    tickClock();
    setTab(state.tab, false);
    renderViewControls();
    renderTop();
    renderUnreadableNotice();
    renderRunningNow();
    renderLive();
    renderArtifacts();
    // Honour the restored view rather than forcing Runs, or the URL param and
    // the stored preference are both silently discarded at boot.
    setShellView(state.shellView);
    fetchRuns();
    fetchLibrary();
    setInterval(tickClock, 1000);
    setInterval(fetchRuns, 1000);
    setInterval(fetchLibrary, 2000);
    setInterval(() => { if (state.modelsFetched) fetchModels(true); }, 30000);
  })();
  </script>
</body>
</html>
