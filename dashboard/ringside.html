<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ringside</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2335d0ff'/%3E%3C/svg%3E">
  <style>
    :root {
      /* Ringside redesign: shipped light-theme primitives. */
      --rs-ground: #FFFFFF; --rs-surface-active: #F4F3F0; --rs-surface-hover: #f8f7f4;
      --rs-ink: #141412; --rs-body-muted: #6d6c66; --rs-body-strong-muted: #3a3935; --rs-label-muted: #8a8983;
      --rs-hairline: #dddcd6; --rs-hairline-soft: #e7e6e0; --rs-rule-strong: #b9b8b0;
      --rs-terminal: #353531; --rs-terminal-ink: #e8e7e2;
      --rs-working: #577590; --rs-pass: #90be6d; --rs-pass-text: #5f9a3e;
      --rs-fail: #f94144; --rs-fail-tint: #fdefee; --rs-pilot: #f9c74f; --rs-pilot-text: #c28e0e; --rs-pilot-tint: #fdf8e9; --rs-waiting: #c9c8c1;
      --rs-grotesk: "Helvetica Neue", Helvetica, Arial, sans-serif; --rs-mono: ui-monospace, Menlo, monospace;
      --rs-poster: 700 76px/.9 var(--rs-grotesk); --rs-view-title: 700 26px/1 var(--rs-grotesk); --rs-panel-title: 700 20px/1.2 var(--rs-grotesk); --rs-stat-number: 700 26px/1 var(--rs-mono);
      --rs-run-name: 600 14px/1.3 var(--rs-grotesk); --rs-lane-name: 600 12px/1.3 var(--rs-mono); --rs-body: 400 11px/1.4 var(--rs-grotesk); --rs-meta: 400 10px/1.4 var(--rs-mono); --rs-micro: 600 9px/1.2 var(--rs-mono); --rs-status: 600 9px/1.2 var(--rs-mono); --rs-badge: 700 8px/1.2 var(--rs-mono);
      --rs-rail-width: 216px; --rs-content-gutter: 28px; --rs-row-y: 13px; --rs-column-gap: 16px; --rs-status-bar-width: 4px; --rs-status-bar-height: 34px; --rs-lane-strip-height: 10px; --rs-lane-gap: 1px; --rs-round-size: 10px; --rs-round-gap: 3px; --rs-elapsed-height: 4px;
      color-scheme: dark;
      --ground: #0b0e14;
      --surface: #0c1219;
      --surface-alt: #0d1319;
      --ink: #e9f0f4;
      --muted: #8998a6;
      --hairline: #19232c;
      --rule: #27323c;
      --accent: #70d7dc;
      --readout: #70d7dc;
      --pass: #4cdda0;
      --fail: #ff735f;
      --waiting: #64727f;
      --quote-bg: rgba(255, 115, 95, .07);
      --running: #70d7dc;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --gutter-w: 6px;
      --row-pad-y: 10px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --ground: #f3f6f7;
        --surface: #ffffff;
        --surface-alt: #edf2f4;
        --ink: #172129;
        --muted: #5f6f7a;
        --hairline: #dce4e8;
        --rule: #bcc9d0;
        --accent: #087f87;
        --readout: #087f87;
        --pass: #087a50;
        --fail: #c74638;
        --waiting: #72808a;
        --quote-bg: rgba(199, 70, 56, .07);
        --running: #087f87;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --ground: #0b0e14; --surface: #0c1219; --surface-alt: #0d1319; --ink: #e9f0f4;
      --muted: #8998a6; --hairline: #19232c; --rule: #27323c; --accent: #70d7dc;
      --readout: #70d7dc; --pass: #4cdda0; --fail: #ff735f; --waiting: #64727f;
      --quote-bg: rgba(255,115,95,.07); --running: #70d7dc;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --ground: #f3f6f7; --surface: #ffffff; --surface-alt: #edf2f4; --ink: #172129;
      --muted: #5f6f7a; --hairline: #dce4e8; --rule: #bcc9d0; --accent: #087f87;
      --readout: #087f87; --pass: #087a50; --fail: #c74638; --waiting: #72808a;
      --quote-bg: rgba(199,70,56,.07); --running: #087f87;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      background: var(--ground);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      margin: 0;
    }
    button, select {
      color: inherit;
      font: inherit;
    }
    button { cursor: pointer; }
    button:focus-visible,
    select:focus-visible,
    iframe:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .corner {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      margin-bottom: clamp(14px, 3vw, 26px);
    }
    .live-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--waiting); align-self: center; flex: 0 0 9px;
    }
    .live-dot.live { background: var(--accent); }
    @media (prefers-reduced-motion: no-preference) {
      .live-dot.live { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
    }
    .eyebrow {
      font-size: 12px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
    }
    .eyebrow b { color: var(--ink); }
    .clock { margin-left: auto; font-size: 12px; color: var(--muted); }
    .server-version {
      max-width: 24ch;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      white-space: nowrap;
    }

    .topbar {
      min-height: 42px;
      margin: 0;
      padding: 9px clamp(12px, 2vw, 22px);
      border-bottom: 1px solid var(--hairline);
      gap: 10px;
    }
    .update-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding: 5px clamp(12px, 2vw, 22px);
      border-bottom: 1px solid var(--hairline);
      background: var(--quote-bg);
      color: var(--ink);
      font-size: 12px;
    }
    .update-banner span { flex: 1 1 auto; }
    .update-banner button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 1px 5px;
      font-size: 16px;
      line-height: 1;
    }
    .update-banner button:hover { color: var(--ink); }
    .running-now {
      display: flex;
      gap: 7px;
      align-items: center;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .running-now:empty { display: none; }
    .run-switch {
      flex: 0 0 auto;
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      line-height: 1;
    }
    .run-switch:hover { border-color: var(--accent); }
    .run-switch[aria-current="true"] {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .run-switch-name {
      max-width: 18ch;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .run-switch-progress { color: var(--muted); font-size: 11px; }
    .run-switch .live-dot { width: 7px; height: 7px; flex-basis: 7px; }
    .artifact-tools button {
      padding: 7px 14px;
      border: 1px solid var(--hairline);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }
    .artifact-tools button:hover { border-color: var(--accent); }
    .artifact-tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .view-switch {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }
    .artifact-tools .view-switch button {
      border-radius: 0;
      padding-inline: 11px;
    }
    .artifact-tools .view-switch button:first-child { border-radius: 6px 0 0 6px; }
    .artifact-tools .view-switch button:last-child {
      margin-left: -1px;
      border-radius: 0 6px 6px 0;
    }
    .artifact-tools .view-switch button[aria-pressed="true"] {
      position: relative;
      border-color: var(--accent);
      color: var(--accent);
      background: var(--ground);
    }
    select,
    .artifact-tools select {
      appearance: none;
      -webkit-appearance: none;
      padding: 7px 30px 7px 12px;
      border: 1px solid var(--hairline);
      border-radius: 7px;
      background-color: var(--surface);
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%238fa0b6' stroke-width='1.6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 11px center;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.3;
      max-width: 100%;
    }
    select:focus-visible,
    summary.run-head:focus-visible,
    .run-switch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .artifact-status { color: var(--ink); opacity: .75; }
    .wordmark {
      font-variant-caps: all-small-caps;
      letter-spacing: .1em;
    }
    .topbar-main {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .reconnect {
      color: var(--muted);
      font-size: 12px;
    }
    .tabs {
      display: flex;
      gap: 18px;
      padding: 8px clamp(12px, 2vw, 22px) 0;
      border-bottom: 1px solid var(--hairline);
    }
    .tab {
      appearance: none;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 8px 0 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .tab[aria-selected="true"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }
    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }
    .panel {
      min-height: 100%;
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: clamp(26px, 6vw, 60px) clamp(12px, 2vw, 22px);
    }
    .unreadable-notice {
      grid-column: 1 / -1;
      margin: 0;
      padding-top: 8px;
      border-top: 1px solid var(--hairline);
      color: var(--muted);
      font-size: 13px;
    }

    .run {
      padding: clamp(18px, 3vw, 28px) clamp(12px, 2vw, 22px) clamp(20px, 3vw, 30px);
      border-bottom: 1px solid var(--hairline);
    }
    .project-group { border-bottom: 1px solid var(--rule); }
    .project-group:last-child { border-bottom: 0; }
    .project-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-height: 30px;
      margin: 0;
      padding: 7px 30px;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface-alt);
      color: var(--muted);
      font: 600 10px/1.4 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .project-head b { color: var(--ink); font-size: 11px; letter-spacing: .04em; text-transform: none; }
    .project-count { margin-left: auto; font-size: 9px; }
    .build-warning {
      margin: 8px 0 0;
      padding: 7px 10px;
      border-left: 2px solid #c18a32;
      background: rgba(193, 138, 50, .08);
      color: #e4ad52;
      font: 10px/1.5 var(--mono);
    }
    .build-badge {
      flex: 0 0 auto;
      padding: 2px 5px;
      border: 1px solid #c18a32;
      color: #e4ad52;
      font: 700 8px/1.2 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .agents { margin-top: clamp(16px, 3vw, 28px); }
    summary.run-head { cursor: pointer; list-style: none; }
    summary.run-head::-webkit-details-marker { display: none; }
    summary.run-head::before {
      content: "▸";
      color: var(--muted);
      font-size: 11px;
      margin-right: 2px;
      transition: transform .15s ease;
      display: inline-block;
    }
    details[open] > summary.run-head::before { transform: rotate(90deg); }
    .run-head {
      margin-bottom: clamp(12px, 2vw, 18px);
    }
    .run-head .eyebrow {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .identity {
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .run-stats {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .pilot-review {
      margin: 0 0 clamp(14px, 2vw, 20px);
      padding: 14px;
      border: 1px solid var(--accent);
      border-left-width: 3px;
      border-radius: 8px;
      background: var(--surface);
    }
    .pilot-banner {
      width: min(100%, 1440px);
      margin-inline: auto;
      padding: clamp(14px, 2vw, 20px) clamp(12px, 2vw, 22px) 0;
    }
    .pilot-banner:empty { display: none; }
    .pilot-review-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .pilot-review-title { color: var(--accent); font-size: 14px; font-weight: 700; }
    .pilot-review-facts { color: var(--muted); font-size: 12px; }
    .pilot-review-copy { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .pilot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pilot-actions button {
      min-width: 92px;
      padding: 7px 14px;
      border-radius: 7px;
      background: transparent;
      font-weight: 700;
    }
    .pilot-actions .approve { border: 1px solid var(--pass); color: var(--pass); }
    .pilot-actions .reject { border: 1px solid var(--fail); color: var(--fail); }
    .pilot-actions button:hover:not(:disabled) { background: var(--ground); }
    .pilot-actions button:disabled { cursor: default; opacity: .55; }
    .pilot-decision-status { margin: 9px 0 0; color: var(--muted); font-size: 12.5px; }
    .pilot-decision-status.approve { color: var(--pass); }
    .pilot-decision-status.reject { color: var(--fail); }
    .pilot-error {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      overflow-wrap: anywhere;
    }
    .pilot-error b { color: var(--fail); }
    .pilot-cli { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; }
    .pilot-cli code { color: var(--ink); overflow-wrap: anywhere; }

    .rounds { display: flex; gap: 5px; margin-bottom: 8px; }
    .rounds span { flex: 1; min-width: 10px; height: 7px; border-radius: 4px; background: var(--waiting); opacity: .45; }
    .rounds .pass { background: var(--pass); opacity: 1; }
    .rounds .working { background: var(--accent); opacity: 1; }
    .rounds .retry,
    .rounds .fail { background: var(--fail); opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .rounds .working, .rounds .retry { animation: pulse 1.4s ease-in-out infinite; }
    }
    section h2 {
      font-size: 12px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      margin: 0 0 4px; padding-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
    }
    .workers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 10px;
      margin-top: clamp(14px, 2vw, 20px);
    }
    .workers > .empty { grid-column: 1 / -1; }
    .worker-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .worker-card.expanded { grid-column: 1 / -1; }
    .worker-card-toggle {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px 12px;
      align-items: center;
      padding: 12px;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .worker-card-toggle:hover .name,
    .worker-card-toggle:focus-visible .name,
    .worker-card-toggle[aria-expanded="true"] .name { color: var(--accent); }
    .worker-card-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .worker-card-head {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .glyph { width: 11px; height: 11px; border-radius: 50%; align-self: center; }
    .glyph.pass { background: var(--pass); }
    .glyph.working { background: var(--accent); }
    .glyph.retry,
    .glyph.fail { background: var(--fail); }
    .glyph.waiting { background: transparent; border: 1.5px solid var(--waiting); }
    @media (prefers-reduced-motion: no-preference) {
      .glyph.working, .glyph.retry { animation: pulse 1.4s ease-in-out infinite; }
    }
    .worker-card .name { font-weight: 650; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .worker-card .state { font-size: 12px; font-weight: 650; white-space: nowrap; }
    .state.pass { color: var(--pass); }
    .state.working { color: var(--accent); }
    .state.retry,
    .state.fail { color: var(--fail); }
    .state.waiting { color: var(--waiting); }
    .worker-card .meta {
      grid-column: 1 / -1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11.5px;
    }
    .worker-card .activity {
      grid-column: 1 / -1;
      font-size: 12.5px;
      color: var(--muted);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .lane-wall {
      padding: clamp(18px, 3vw, 28px) clamp(12px, 2vw, 22px) clamp(20px, 3vw, 30px);
    }
    .lane-wall-head {
      display: flex;
      align-items: baseline;
      gap: 10px 18px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
    }
    .lane-wall-head h2 {
      margin: 0;
      padding: 0;
      border: 0;
    }
    .lane-census { margin: 0; color: var(--ink); font-size: 13px; }
    .lane-wall-note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .wall-card .worker-card-head { align-items: flex-start; }
    .wall-card .wall-lane {
      min-width: 0;
      display: grid;
      gap: 1px;
    }
    .wall-card .run-name {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .violations {
      list-style: none;
      margin: 0 12px 12px;
      padding: 8px 10px;
      border-left: 2px solid var(--fail);
      border-radius: 0 6px 6px 0;
      background: var(--quote-bg);
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .violations li + li { margin-top: 5px; }
    .violations b { color: var(--fail); font-weight: 700; }
    .stream {
      padding: 12px;
      border-top: 1px solid var(--hairline);
    }
    .stream-head {
      display: flex;
      gap: 12px;
      align-items: baseline;
      color: var(--muted);
      font-size: 12px;
      padding: 10px 0 8px;
    }
    .stream pre {
      max-height: 45vh;
      margin: 0;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--surface);
      color: var(--ink);
      border-left: 2px solid var(--accent);
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
    }
    .catch {
      margin: 8px 0 0; padding: 8px 12px;
      background: var(--quote-bg);
      border-left: 2px solid var(--fail);
      border-radius: 0 6px 6px 0;
      font-size: 13px; color: var(--muted);
      overflow-wrap: break-word;
    }
    .catch b { color: var(--fail); font-weight: 650; }
    .stream .brief {
      margin: 0 0 10px;
      border-left: 2px solid var(--hairline);
      background: var(--surface);
    }
    .stream .brief summary {
      cursor: pointer;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 650;
      color: var(--muted);
      list-style: none;
    }
    .stream .brief summary::-webkit-details-marker { display: none; }
    .stream .brief summary::before { content: "▸ "; }
    .stream .brief[open] summary::before { content: "▾ "; }
    .stream .brief pre {
      max-height: 32vh;
      border-left: none;
      border-top: 1px solid var(--hairline);
    }
    .stream .brief .brief-check {
      margin: 0;
      padding: 8px 12px;
      border-top: 1px solid var(--hairline);
      font-size: 11.5px;
      color: var(--muted);

    }
    .stream .verdict {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stream .verdict .how { margin: 0 0 6px; }
    .stream .verdict .how b { color: var(--pass); font-weight: 650; }
    .stream .verdict details summary {
      cursor: pointer;
      font-size: 12.5px;
      color: var(--muted);
    }
    .stream .verdict pre { max-height: 28vh; margin-top: 6px; }

    .artifact-layout {
      min-height: calc(100vh - 83px);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
    }
    .artifact-main,
    .agents {
      width: min(100%, 1440px);
      margin-inline: auto;
    }
    .artifact-row {
      width: 100%;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 12px clamp(12px, 2vw, 18px);
      border: 0;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
      text-align: left;
    }
    .artifact-row[aria-current="true"] {
      background: var(--surface);
    }
    .artifact-state-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--waiting);
    }
    .artifact-row.live .artifact-state-dot { background: var(--accent); }
    .artifact-row.pass .artifact-state-dot { background: var(--pass); }
    .artifact-row.fail .artifact-state-dot,
    .artifact-row.died .artifact-state-dot { background: var(--fail); }
    @media (prefers-reduced-motion: no-preference) {
      .artifact-row.live .artifact-state-dot { animation: pulse 1.4s ease-in-out infinite; }
    }
    .artifact-row-main {
      min-width: 0;
      display: grid;
      gap: 1px;
    }
    .artifact-name {
      font-weight: 650;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .artifact-age {
      color: var(--muted);
      font-size: 12px;
    }
    .artifact-main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .artifact-tools {
      display: grid;
      grid-template-columns: max-content minmax(220px, max-content) minmax(0, 1fr) minmax(180px, max-content) max-content;
      gap: 12px;
      align-items: center;
      padding: 10px clamp(12px, 2vw, 18px);
      border-bottom: 1px solid var(--hairline);
    }
    .artifact-status {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 13px;
    }
    .artifact-tools select,
    .artifact-tools button {
      min-height: 30px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      color: var(--ink);
      font-size: 12px;
    }
    .artifact-tools select {
      min-width: 0;
      padding: 0 8px;
    }
    .artifact-tools button {
      padding: 0 10px;
      font-weight: 700;
    }
    .frame-wrap {
      min-height: 120px;
      background: var(--surface);
      border: 0;
    }
    .frame-wrap iframe {
      display: block;
      width: 100%;
      border: 0;
      background: var(--surface);
    }
    .artifact-error {
      color: var(--muted);
      font-size: 14px;
      padding: clamp(22px, 4vw, 42px);
    }

    @media (max-width: 760px) {
      .topbar-main { flex-wrap: wrap; gap: 6px 10px; }
      .running-now { order: 3; flex-basis: 100%; }
      .run-head .clock { width: 100%; margin-left: 21px; }
      .artifact-layout {
        min-height: auto;
        display: block;
      }
      .artifact-rail {
        border-right: 0;
        border-bottom: 1px solid var(--hairline);
        max-height: 34vh;
        overflow: auto;
      }
      .artifact-tools {
        grid-template-columns: 1fr;
      }
      .frame-wrap iframe {
        min-height: 58vh;
      }
    }
    @media (max-width: 720px) {
      .workers { grid-template-columns: minmax(0, 1fr); }
      .worker-card.expanded { grid-column: auto; }
    }

    /* Control-room shell -------------------------------------------------- */
    html, body { min-height: 100%; }
    body {
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.35;
    }
    button, select, .mono { font-family: var(--mono); }
    .page { min-height: 100vh; background: var(--ground); }

    .corner {
      align-items: center;
      gap: 10px;
      margin-bottom: 0;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      flex-basis: 8px;
      border: 1px solid var(--waiting);
      border-radius: 0;
      background: transparent;
      transform: rotate(45deg);
    }
    .live-dot.live {
      border-color: var(--running);
      background: var(--running);
    }
    .eyebrow {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
    }
    .eyebrow b { color: var(--ink); }
    .clock { color: var(--muted); font-size: 10px; }

    .topbar {
      min-height: 42px;
      padding: 0 22px;
      border-bottom: 1px solid var(--rule);
      background: var(--ground);
      gap: 14px;
    }
    .topbar-main { align-items: center; gap: 10px; }
    .wordmark {
      font-family: var(--mono);
      font-variant-caps: normal;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .reconnect { color: var(--running); font-size: 10px; text-transform: uppercase; }
    .running-now {
      justify-content: flex-end;
      gap: 0;
      margin-left: auto;
      overflow: hidden;
    }
    .run-switch {
      gap: 8px;
      min-height: 22px;
      padding: 0 10px;
      border: 0;
      border-left: 1px solid var(--hairline);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .run-switch:first-child { border-left: 0; }
    .run-switch:hover { border-color: var(--rule); color: var(--ink); }
    .run-switch[aria-current="true"] {
      border-color: var(--rule);
      color: var(--ink);
      box-shadow: none;
    }
    .run-switch-name { max-width: 24ch; font-weight: 650; }
    .run-switch-progress { color: var(--readout); font-size: 9px; }
    .run-switch .live-dot { width: 6px; height: 6px; flex-basis: 6px; }

    .update-banner {
      min-height: 28px;
      padding: 0 22px;
      border-bottom: 1px solid var(--rule);
      background: var(--quote-bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .04em;
    }
    .update-banner button { border-left: 1px solid var(--rule); border-radius: 0; }

    .tabs {
      gap: 0;
      min-height: 32px;
      padding: 0 22px;
      border-bottom: 1px solid var(--rule);
      background: var(--ground);
    }
    .tab {
      min-width: 76px;
      padding: 0 14px;
      border: 0;
      border-left: 1px solid var(--hairline);
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      line-height: 31px;
      text-transform: uppercase;
    }
    .tab:last-child { border-right: 1px solid var(--hairline); }
    .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

    main { background: var(--ground); }
    .panel, .artifact-main { min-height: 0; }
    .empty, .artifact-error {
      padding: 24px 30px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }
    .unreadable-notice {
      margin: 0;
      padding: 7px 10px;
      border-top: 1px solid var(--rule);
      color: var(--fail);
      font-family: var(--mono);
      font-size: 10px;
    }

    .artifact-layout {
      min-height: calc(100vh - 42px);
      grid-template-rows: auto minmax(0, 1fr);
    }
    .artifact-main, .agents {
      width: 100%;
      max-width: none;
      margin-inline: 0;
    }
    .artifact-main { grid-template-rows: auto minmax(0, 1fr) auto; }
    .artifact-tools {
      min-height: 40px;
      grid-template-columns: max-content minmax(280px, 1.25fr) minmax(130px, .7fr) minmax(250px, 1fr) max-content;
      gap: 10px;
      padding: 5px 18px;
      border-bottom: 1px solid var(--rule);
      background: var(--surface-alt);
    }
    .artifact-tools select,
    .artifact-tools button,
    .artifact-tools .view-switch button {
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--hairline);
      border-radius: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .artifact-tools button:hover,
    .artifact-tools select:hover { border-color: var(--rule); }
    .artifact-tools .view-switch button { min-width: 78px; text-transform: uppercase; }
    .artifact-tools .view-switch button:first-child,
    .artifact-tools .view-switch button:last-child { border-radius: 0; }
    .artifact-tools .view-switch button[aria-pressed="true"] {
      z-index: 1;
      border-color: var(--accent);
      background: var(--surface);
      color: var(--accent);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    select, .artifact-tools select {
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--ground);
      background-image: none;
      color: var(--ink);
    }
    .artifact-status {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .frame-wrap {
      min-height: 120px;
      border-bottom: 1px solid var(--rule);
      background: var(--ground);
    }
    .frame-wrap iframe { background: var(--ground); }

    .pilot-banner {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .pilot-review {
      margin: 0;
      padding: 10px 18px 10px calc(18px + var(--gutter-w));
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-left: var(--gutter-w) solid var(--accent);
      border-radius: 0;
      background: var(--surface);
    }
    .pilot-review-head { margin-bottom: 3px; }
    .pilot-review-title,
    .pilot-review-facts,
    .pilot-review-copy,
    .pilot-decision-status,
    .pilot-error,
    .pilot-cli { font-family: var(--mono); font-size: 10px; }
    .pilot-actions button {
      min-width: 76px;
      padding: 4px 10px;
      border-radius: 0;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
    }
    .pilot-banner {
      border-bottom: 1px solid var(--rule);
      background: var(--surface);
    }
    .pilot-queue-shell {
      display: grid;
      grid-template-columns: minmax(190px, 250px) minmax(0, 1fr) minmax(220px, 280px);
      min-height: 190px;
    }
    .pilot-queue {
      padding: 14px;
      border-right: 1px solid var(--rule);
      background: var(--ground);
    }
    .pilot-queue-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .pilot-queue-title { margin: 0; color: var(--ink); font: 700 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .pilot-queue-count {
      min-width: 24px; padding: 1px 6px; border: 1px solid #c18a32; color: #e4ad52;
      font: 700 10px/1.5 var(--mono); text-align: center;
    }
    .pilot-queue-list { display: grid; gap: 5px; margin: 12px 0 0; padding: 0; list-style: none; }
    .pilot-queue-item { width: 100%; padding: 8px; border: 1px solid var(--hairline); background: transparent; color: var(--muted); text-align: left; }
    .pilot-queue-item:hover { border-color: #c18a32; }
    .pilot-queue-item[aria-current="true"] { border-color: #c18a32; background: rgba(193, 138, 50, .08); color: var(--ink); }
    .pilot-queue-run, .pilot-queue-meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px/1.5 var(--mono); }
    .pilot-queue-run { font-weight: 700; }
    .pilot-queue-meta { color: var(--muted); }
    .pilot-queue-empty { margin: 14px 0 0; color: var(--muted); font: 10px/1.55 var(--mono); }
    .pilot-review {
      display: contents;
    }
    .pilot-review-main { min-width: 0; padding: 14px 18px; border-left: var(--gutter-w) solid #c18a32; }
    .pilot-review.abandoned .pilot-review-main { border-left-color: var(--waiting); }
    .pilot-review-title { color: #e4ad52; }
    .pilot-evidence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .pilot-evidence-item { min-width: 0; padding: 8px 10px; border: 1px solid var(--hairline); background: var(--ground); }
    .pilot-evidence-label { display: block; margin-bottom: 3px; color: var(--muted); font: 9px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .pilot-evidence-value { display: block; overflow-wrap: anywhere; color: var(--ink); font: 10px/1.5 var(--mono); }
    .pilot-evidence-value.pass { color: var(--pass); }
    .pilot-last-note { grid-column: 1 / -1; border-left: 2px solid #c18a32; }
    .pilot-clear { padding: 14px; border-left: 1px solid var(--rule); background: var(--surface-alt); }
    .pilot-clear-title { margin: 0 0 10px; color: var(--muted); font: 700 9px/1.4 var(--mono); letter-spacing: .09em; text-transform: uppercase; }
    .pilot-note-label { display: block; margin: 12px 0 5px; color: #e4ad52; font: 700 10px/1.4 var(--mono); }
    .pilot-note {
      width: 100%; min-height: 76px; resize: vertical; padding: 8px; border: 1px solid #c18a32;
      border-radius: 0; background: var(--ground); color: var(--ink); font: 11px/1.5 var(--mono);
    }
    .pilot-note:focus-visible { outline: 2px solid #e4ad52; outline-offset: 2px; }
    .pilot-actions { display: grid; gap: 7px; }
    .pilot-actions button { width: 100%; min-height: 32px; }
    .pilot-actions .approve { border-color: var(--pass); background: var(--pass); color: var(--ground); }
    .pilot-actions .revise { border: 1px solid #c18a32; color: #e4ad52; }
    .pilot-actions .reject { border: 0; color: var(--fail); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
    .pilot-decision-status.revise { color: #e4ad52; }
    .pilot-timeout { color: var(--fail); }
    .pilot-empty-workspace { grid-column: 2 / -1; display: grid; place-content: center; padding: 24px; color: var(--muted); font: 10px/1.6 var(--mono); }

    .agents { margin-top: 0; background: var(--ground); }
    .run {
      padding: 0 30px 14px;
      border-bottom: 1px solid var(--rule);
    }
    .run-head {
      min-height: 40px;
      margin-bottom: 0;
      border-bottom: 1px solid var(--rule);
    }
    summary.run-head::before { color: var(--muted); font-size: 9px; }
    .run-head .eyebrow { font-size: 11px; }
    .identity, .run-stats { font-family: var(--mono); font-size: 10px; }
    .run-stats { color: var(--readout); }
    .rounds {
      gap: 4px;
      margin: 8px 0 0;
      padding: 0;
    }
    .rounds span {
      height: 3px;
      border-radius: 0;
      background: var(--waiting);
      opacity: .55;
    }

    section h2 {
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .12em;
    }
    .workers {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      margin-top: 8px;
      border-top: 1px solid var(--rule);
    }
    .worker-card,
    .worker-card.expanded {
      grid-column: auto;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-left: var(--gutter-w) solid var(--waiting);
      border-radius: 0;
      background: var(--surface);
    }
    .worker-card:has(.glyph.pass) { border-left-color: var(--pass); }
    .worker-card:has(.glyph.working) { border-left-color: var(--running); }
    .worker-card:has(.glyph.retry),
    .worker-card:has(.glyph.fail) { border-left-color: var(--fail); }
    .worker-card-toggle {
      min-height: 50px;
      grid-template-columns: minmax(170px, 1.1fr) minmax(155px, auto) minmax(200px, 1.25fr) minmax(240px, 2fr);
      gap: 0;
      padding: var(--row-pad-y) 14px;
      background: transparent;
    }
    .worker-card-toggle:hover,
    .worker-card-toggle[aria-expanded="true"] { background: var(--surface-alt); }
    .worker-card-toggle:hover .name,
    .worker-card-toggle:focus-visible .name,
    .worker-card-toggle[aria-expanded="true"] .name { color: var(--ink); }
    .worker-card-head { gap: 0; padding-right: 14px; }
    .glyph { display: none; }
    .worker-card .name {
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 650;
    }
    .worker-card .state {
      padding-right: 14px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      /* nowrap is inherited from the base rule, and a grid item defaults to
         min-width:auto, so a label wider than its track paints over the next
         column instead of being contained. "finished & checked" did exactly
         that. Clip rather than collide. */
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .state.pass { color: var(--pass); }
    .state.working { color: var(--running); }
    .state.retry, .state.fail { color: var(--fail); }
    .state.waiting { color: var(--waiting); }
    .worker-card .meta {
      grid-column: auto;
      padding-right: 14px;
      color: var(--muted);
      font-size: 10px;
    }
    .worker-card .activity {
      grid-column: auto;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
    }

    .lane-wall { padding: 0 30px 18px; }
    .lane-wall-head {
      min-height: 40px;
      gap: 18px;
      padding: 0;
      border-bottom: 1px solid var(--rule);
    }
    .lane-wall-head h2 { color: var(--ink); }
    .lane-census { color: var(--muted); font-size: 10px; }
    .lane-wall-note {
      margin: 0;
      padding: 8px 0;
      border-bottom: 1px solid var(--hairline);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
    }
    .lane-wall .workers { margin-top: 0; border-top: 0; }
    .wall-card .wall-lane { gap: 0; }
    .wall-card .run-name { color: var(--muted); font-family: var(--mono); font-size: 9px; }

    .violations {
      margin: 0;
      padding: 8px 14px;
      border-left: 0;
      border-top: 1px solid var(--fail);
      border-radius: 0;
      background: var(--quote-bg);
      font-family: var(--mono);
      font-size: 10px;
    }
    .stream { padding: 0 14px 12px; border-top: 1px solid var(--rule); }
    .stream-head { padding: 8px 0 6px; font-size: 10px; }
    .stream pre {
      max-height: 34vh;
      border-left: 2px solid var(--accent);
      background: var(--ground);
      padding: 10px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.45;
    }
    .catch,
    .stream .brief summary,
    .stream .verdict,
    .stream .verdict details summary { border-radius: 0; font-family: var(--mono); font-size: 10px; }
    .stream .brief { border-left-color: var(--rule); background: var(--ground); }
    .stream .brief .brief-check { font-size: 10px; }

    .artifact-row {
      grid-template-columns: var(--gutter-w) minmax(0, 1fr);
      gap: 10px;
      padding: var(--row-pad-y) 14px;
      border-bottom: 1px solid var(--rule);
    }
    .artifact-state-dot { width: var(--gutter-w); height: 100%; min-height: 26px; border-radius: 0; }
    .artifact-name { font-family: var(--mono); font-size: 11px; }
    .artifact-age { font-family: var(--mono); font-size: 9px; }

    @media (max-width: 900px) {
      .topbar { padding-inline: 14px; }
      .running-now { display: none; }
      .artifact-tools {
        grid-template-columns: max-content minmax(180px, 1fr) minmax(180px, 1fr) max-content;
        padding-inline: 12px;
      }
      .artifact-status { display: none; }
      .worker-card-toggle {
        grid-template-columns: minmax(140px, 1fr) 82px minmax(190px, 1.3fr);
      }
      .worker-card .activity { grid-column: 1 / -1; padding-top: 5px; }
      .pilot-queue-shell { grid-template-columns: 190px minmax(0, 1fr); }
      .pilot-clear { grid-column: 2; border-top: 1px solid var(--rule); }
    }
    @media (max-width: 640px) {
      .artifact-tools { grid-template-columns: 1fr 1fr; }
      .artifact-tools .view-switch { grid-column: 1 / -1; }
      .artifact-tools .view-switch button { width: 50%; }
      .artifact-layout { min-height: auto; }
      .run, .lane-wall { padding-inline: 14px; }
      .project-head { padding-inline: 14px; }
      .worker-card-toggle {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 10px;
      }
      .worker-card .meta,
      .worker-card .activity { grid-column: 1 / -1; padding: 0; }
      .frame-wrap iframe { min-height: 58vh; }
      .pilot-queue-shell { display: block; }

<body>
  <div class="ringside-shell">
  <aside class="ringside-rail" aria-label="Ringside navigation">
    <div class="rail-header"><span id="rail-live" class="rail-live" aria-hidden="true"></span><span class="rail-title">Ringside</span><span id="rail-build" class="rail-build">unknown</span></div>
    <nav class="rail-nav" aria-label="Dashboard views">
      <button class="rail-nav-item" type="button" data-shell-view="runs" aria-current="page"><span>Runs</span><span id="rail-runs-count" class="rail-count">0</span></button>
      <button class="rail-nav-item" type="button" data-shell-view="lanes"><span>Lanes</span><span id="rail-lanes-count" class="rail-count">0</span></button>
      <button class="rail-nav-item" type="button" data-shell-view="reviews"><span>Reviews</span><span id="rail-reviews-count" class="rail-count rail-review-badge">0</span></button>
      <button class="rail-nav-item" type="button" data-shell-view="artifacts"><span>Artifacts</span><span id="rail-artifacts-count" class="rail-count">0</span></button>
      <button class="rail-nav-item" type="button" data-shell-view="models"><span>Models</span></button>
    </nav>
    <div id="rail-foot" class="rail-foot" aria-live="polite">0 swarms live</div>
  </aside>
  <div class="ringside-content">
    <section id="runs-overview" class="runs-overview shell-view" data-shell-panel="runs" aria-label="Runs overview" aria-live="polite"></section>
    <section id="lanes-view" class="shell-view" data-shell-panel="lanes" aria-label="Lane wall" hidden></section>
    <section id="reviews-view" class="shell-view" data-shell-panel="reviews" aria-label="Pilot reviews" hidden></section>
    <section id="artifacts-view" class="shell-view" data-shell-panel="artifacts" aria-label="Artifact preview" hidden></section>
    <section id="models-view" class="shell-view" data-shell-panel="models" aria-label="Models scoreboard" hidden></section>
  <div class="page legacy-page" data-shell-panel="legacy" hidden>
    <aside id="update-banner" class="update-banner" role="status" hidden>
      <span id="update-message"></span>
      <button id="dismiss-update" type="button" aria-label="Dismiss update notice">×</button>
    </aside>
    <header class="corner topbar">
      <span id="top-dot" class="live-dot" aria-hidden="true"></span>
      <div class="topbar-main">
        <span class="eyebrow wordmark"><b>Ringside</b></span>
        <span id="reconnect" class="reconnect mono" hidden>reconnecting…</span>
      </div>
      <div id="running-now" class="running-now" role="group" aria-label="Running now"></div>
      <span id="server-version" class="server-version" title="Ringer build unknown">build unknown</span>
      <time id="clock" class="clock mono"></time>
    </header>

    <main>
      <section id="artifacts-panel" class="panel">
        <div class="artifact-layout">
          <div id="pilot-banner" class="pilot-banner" aria-label="Pilot review queue"></div>
          <section class="artifact-main" aria-label="Artifact preview">
            <div class="artifact-tools">
              <div id="view-switch" class="view-switch" role="group" aria-label="Runs view">
                <button type="button" data-view="single" aria-pressed="true">Single run</button>
                <button type="button" data-view="lanes" aria-pressed="false">Lane wall</button>
              </div>
              <select id="artifact-picker" class="mono" aria-label="Artifact"></select>
              <div id="artifact-status" class="artifact-status">No artifact selected.</div>
              <select id="artifact-version" class="mono" aria-label="Artifact version"></select>
              <button id="open-folder" type="button" title="Open this run's files in Finder">Open folder</button>
              <p id="unreadable-notice" class="unreadable-notice" role="status" hidden></p>
            </div>
            <div id="frame-wrap" class="frame-wrap">
              <div class="artifact-error">No artifacts yet.</div>
            </div>
            <section id="agents" class="agents" aria-label="Agents">
              <div id="runs"></div>
            </section>
          </section>
        </div>
      </section>
    </main>
  </div>
  </div>
  <div id="slide-root"></div>
  </div>

  <script>
  (() => {
    const TAB_KEY = "ringside-tab";
    // The rail's view is persisted the same way the legacy tab is: a URL param
    // so a view can be linked and reloaded, backed by localStorage so the page
    // reopens where you left it. Without this a reload always dropped you back
    // on Runs, which the handoff's State Management section rules out.
    const SHELL_VIEW_KEY = "ringside-shell-view";
    const SHELL_VIEWS = ["runs", "lanes", "reviews", "artifacts", "models"];
    function normalizeShellView(value) {
      const view = String(value || "").trim().toLowerCase();
      return SHELL_VIEWS.includes(view) ? view : "";
    }
    const ARTIFACT_KEY = "ringside-artifact-selection";
    const query = new URLSearchParams(window.location.search);
    const queryTab = normalizeTab(query.get("tab"));
    const queryRun = String(query.get("run") || "").trim();
    const queryView = normalizeView(query.get("view"));
    const state = {
      runs: [],
      serverVersion: "",
      active: {},
      update: null,
      artifacts: [],
      runError: null,
      libraryError: null,
      runUnreadable: 0,
      libraryUnreadable: 0,
      tab: queryTab || normalizeTab(localStorage.getItem(TAB_KEY)) || "live",
      view: queryView || "single",
      hasStoredTab: Boolean(normalizeTab(localStorage.getItem(TAB_KEY))),
      expanded: new Map(),
      logTimer: null,
      artifactName: sessionStorage.getItem(ARTIFACT_KEY) || "",
      artifactManual: Boolean(sessionStorage.getItem(ARTIFACT_KEY)),
      artifactVersion: "live",
      frameKey: "",
      frameContent: "",
      frameRequest: 0,
      rendering: false,
      runOpen: {},
      focusedRunId: queryRun,
      shellView: normalizeShellView(query.get("shell"))
        || normalizeShellView(localStorage.getItem(SHELL_VIEW_KEY))
        || "runs",
      panelOpen: false,
      selectedRunId: "",
      selectedLaneKey: "",
      panelReturnFocus: null,
      restoreRunFromUrl: Boolean(queryRun),
      pilotDecisions: new Map(),
      pilotNotes: new Map()
    };
    Object.assign(state, {models: null, modelsError: "", modelsFetched: false, modelsFetching: false, artifactLoading: false, artifactRefreshKey: "", updateDismissed: false});

    const els = {
      runsOverview: document.getElementById("runs-overview"),
      lanesView: document.getElementById("lanes-view"),
      reviewsView: document.getElementById("reviews-view"),
      artifactsView: document.getElementById("artifacts-view"),
      modelsView: document.getElementById("models-view"),
      legacyPage: document.querySelector(".legacy-page"),
      slideRoot: document.getElementById("slide-root"),
      railLive: document.getElementById("rail-live"),
      railBuild: document.getElementById("rail-build"),
      railRunsCount: document.getElementById("rail-runs-count"),
      railLanesCount: document.getElementById("rail-lanes-count"),
      railReviewsCount: document.getElementById("rail-reviews-count"),
      railArtifactsCount: document.getElementById("rail-artifacts-count"),
      railFoot: document.getElementById("rail-foot"),
      topDot: document.getElementById("top-dot"),
      reconnect: document.getElementById("reconnect"),
      clock: document.getElementById("clock"),
      runningNow: document.getElementById("running-now"),
      serverVersion: document.getElementById("server-version"),
      updateBanner: document.getElementById("update-banner"),
      updateMessage: document.getElementById("update-message"),
      dismissUpdate: document.getElementById("dismiss-update"),
      pilotBanner: document.getElementById("pilot-banner"),
      unreadableNotice: document.getElementById("unreadable-notice"),
      runs: document.getElementById("runs"),
      viewSwitch: document.getElementById("view-switch"),
      artifactMain: document.querySelector(".artifact-main"),
      artifactPicker: document.getElementById("artifact-picker"),
      artifactStatus: document.getElementById("artifact-status"),
      artifactVersion: document.getElementById("artifact-version"),
      frameWrap: document.getElementById("frame-wrap"),
      openFolder: document.getElementById("open-folder")
    };

    function normalizeTab(value) {
      return value === "live" || value === "artifacts" ? value : "";
    }

    function normalizeView(value) {
      return value === "single" || value === "lanes" ? value : "";
    }

    function updateKey(update) {
      return update ? `${Number(update.behind) || 0}:${String(update.reason || "")}` : "";
    }

    function renderUpdateBanner() {
      const behind = Number(state.update?.behind) || 0;
      const reason = String(state.update?.reason || "").trim();
      const key = updateKey(state.update);
      const dismissed = sessionStorage.getItem("ringside-dismissed-update") === key;
      if (behind <= 0 || !reason || dismissed) {
        els.updateBanner.hidden = true;
        return;
      }
      els.updateMessage.textContent = `Ringer update available: ${behind} commit(s) behind — ${reason}`;
      els.updateBanner.hidden = false;
    }

    function renderUnreadableNotice() {
      const count = state.runUnreadable + state.libraryUnreadable;
      els.unreadableNotice.textContent = count === 1
        ? "1 record could not be read."
        : `${count} records could not be read.`;
      els.unreadableNotice.hidden = count === 0;
    }

    els.dismissUpdate.addEventListener("click", () => {
      sessionStorage.setItem("ringside-dismissed-update", updateKey(state.update));
      renderUpdateBanner();
    });

    function tickClock() {
      els.clock.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function numberOrZero(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function parseTime(value) {
      const stamp = Date.parse(value || "");
      return Number.isFinite(stamp) ? stamp : 0;
    }

    function elapsedForRun(run) {
      const current = Number(run.elapsed_s);
      if (run.state !== "live" && Number.isFinite(current)) return current;
      const started = parseTime(run.started_at);
      if (!started) return Number.isFinite(current) ? current : 0;
      return Math.max(Number.isFinite(current) ? current : 0, (Date.now() - started) / 1000);
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.floor(numberOrZero(seconds)));
      if (!total) return "—";
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours) return `${hours}h ${String(minutes).padStart(2, "0")}m`;
      if (minutes) return `${minutes}m ${String(secs).padStart(2, "0")}s`;
      return `${secs}s`;
    }

    function formatTokens(value) {
      return `${Math.round(numberOrZero(value)).toLocaleString()} tok`;
    }

    function relativeAgo(value) {
      const stamp = parseTime(value);
      if (!stamp) return "unknown";
      const diff = Math.max(0, Math.floor((Date.now() - stamp) / 1000));
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function runId(run, index = 0) {
      return String(run.run_id || run.id || `${run.identity || "run"}-${run.run_name || "ringer"}-${run.started_at || index}`);
    }

    function projectInfo(run) {
      const path = String(run?.project || "").trim().replace(/\/+$/, "");
      if (!path) return {key: "unknown", name: "Unknown project", path: "Project path was not recorded"};
      const name = path.split("/").filter(Boolean).pop() || "Unknown project";
      return {key: `path:${path}`, name, path};
    }

    function displayVersion(value) {
      const version = String(value || "").trim();
      if (!version) return "unknown";
      // A clean checkout reports a bare git sha, but a dirty one reports the
      // `source-<sha256>` fingerprint fallback — 71 characters that blew the
      // rail header apart until this handled the prefix too.
      const prefixed = version.match(/^([A-Za-z][\w.-]*-)([0-9a-f]{12,})$/i);
      if (prefixed) return prefixed[1] + prefixed[2].slice(0, 8);
      return /^[0-9a-f]{12,}$/i.test(version) ? version.slice(0, 8) : version;
    }

    function hasBuildMismatch(run) {
      const runVersion = String(run?.ringer_version || "").trim();
      return Boolean(runVersion && state.serverVersion && runVersion !== state.serverVersion);
    }

    function appendBuildWarning(parent, run) {
      if (!hasBuildMismatch(run)) return;
      const warning = document.createElement("p");
      warning.className = "build-warning";
      warning.setAttribute("role", "status");
      warning.title = `Run build: ${run.ringer_version}; served build: ${state.serverVersion}`;
      warning.textContent = `Warning: this run was produced by a different Ringer build (${displayVersion(run.ringer_version)}) than this page is serving (${displayVersion(state.serverVersion)}).`;
      parent.appendChild(warning);
    }

    function appendSystemStates(parent) {
      const region = document.createElement("div");
      region.className = "system-region";
      region.dataset.key = "system-region";
      region.setAttribute("aria-live", "polite");
      if (state.runError || state.libraryError) {
        const bar = document.createElement("div"); bar.className = "system-bar reconnecting"; bar.setAttribute("role", "status");
        const dot = document.createElement("span"); dot.className = "system-pulse"; dot.setAttribute("aria-hidden", "true");
        const label = document.createElement("span"); label.className = "system-label"; label.textContent = "RECONNECTING…";
        const note = document.createElement("span"); note.className = "system-note"; note.textContent = `Latest data may be stale · ${state.runError || state.libraryError}`;
        const retry = document.createElement("button"); retry.type = "button"; retry.className = "system-action"; retry.textContent = "RETRY NOW"; retry.addEventListener("click", () => { fetchRuns(); fetchLibrary(); if (state.shellView === "models") fetchModels(true); });
        bar.append(dot, label, note, retry); region.appendChild(bar);
      }
      const behind = numberOrZero(state.update?.behind); const reason = String(state.update?.reason || "").trim(); const dismissed = sessionStorage.getItem("ringside-dismissed-update") === updateKey(state.update);
      if (behind > 0 && reason && !dismissed) {
        const bar = document.createElement("div"); bar.className = "system-bar update-state"; bar.setAttribute("role", "status");
        const prose = document.createElement("span"); prose.append("Ringer update available · ", Object.assign(document.createElement("b"), {textContent: `${behind} commit${behind === 1 ? "" : "s"} behind`}), document.createTextNode(` · ${reason}`));
        const close = document.createElement("button"); close.type = "button"; close.className = "system-dismiss"; close.setAttribute("aria-label", "Dismiss update notice"); close.textContent = "✕"; close.addEventListener("click", () => { sessionStorage.setItem("ringside-dismissed-update", updateKey(state.update)); renderTop(); });
        bar.append(prose, close); region.appendChild(bar);
      }
      const mismatch = state.runs.find(hasBuildMismatch);
      if (mismatch) {
        const bar = document.createElement("div"); bar.className = "system-bar build-mismatch"; bar.setAttribute("role", "status");
        const chip = document.createElement("span"); chip.className = "build-chip"; chip.textContent = `build ${displayVersion(mismatch.ringer_version)}`;
        const prose = document.createElement("span"); prose.textContent = `${mismatch.run_name} was produced by a different Ringer build than this server (${displayVersion(state.serverVersion)}).`;
        bar.append(chip, prose); region.appendChild(bar);
      }
      if (region.childElementCount) parent.appendChild(region);
    }

    function taskKey(task, index = 0) {
      return String(task.key || task.id || task.name || `task-${index}`);
    }

    function expansionKey(runIdValue, taskKeyValue) {
      return JSON.stringify([String(runIdValue), String(taskKeyValue)]);
    }

    function normalizeRuns(payload) {
      const raw = Array.isArray(payload) ? payload : (Array.isArray(payload?.runs) ? payload.runs : []);
      const runs = raw.filter(Boolean).map((run, index) => {
        const totals = run.totals && typeof run.totals === "object" ? run.totals : {};
        const summary = run.summary && typeof run.summary === "object" ? run.summary : {};
        const rawState = String(run.state || "").toLowerCase();
        const live = rawState === "live" || (!run.finished && rawState !== "finished" && rawState !== "died");
        const stateName = rawState === "died" ? "died" : (live ? "live" : "finished");
        const pass = numberOrZero(run.pass ?? summary.pass ?? totals.pass);
        const fail = numberOrZero(run.fail ?? summary.fail ?? totals.fail);
        const doneSource = run.done ?? summary.done ?? totals.done;
        const done = doneSource === undefined || doneSource === null
          ? pass + fail
          : numberOrZero(doneSource);
        const tokens = numberOrZero(run.tokens ?? summary.tokens ?? totals.tokens);
        return {
          ...run,
          __index: index,
          __id: runId(run, index),
          state: stateName,
          run_name: String(run.run_name || "ringer"),
          identity: String(run.identity || "unknown"),
          started_at: String(run.started_at || ""),
          elapsed_s: elapsedForRun({...run, state: stateName}),
          pass,
          fail,
          done,
          tokens,
          tasks: Array.isArray(run.tasks) ? run.tasks : []
        };
      });
      runs.sort((left, right) => {
        const leftLive = left.state === "live" ? 0 : 1;

    function renderTop() {
      const anyLive = runningNowRuns().length > 0;
      els.topDot.classList.toggle("live", anyLive);

    function effectiveFocusedRunId(liveRuns) {
      if (liveRuns.some(run => run.__id === state.focusedRunId)) return state.focusedRunId;
      return liveRuns.find(run => run.run_name === state.artifactName)?.__id || "";
    }

    function syncFocusedRunSelection() {
      if (state.restoreRunFromUrl) return;
      const current = state.runs.find(run => run.__id === state.focusedRunId);
      if (current && (!state.artifactName || current.run_name === state.artifactName)) return;
      const artifact = selectedArtifact();
      const next = state.runs.find(run => run.__id === artifact?.current_run_id)
        || state.runs.find(run => run.run_name === state.artifactName);
      const nextId = next?.__id || "";
      if (state.focusedRunId === nextId) return;
      state.focusedRunId = nextId;
      replaceUrlState();
    }

    function renderRunningNow() {
      const liveRuns = runningNowRuns();
      const staging = document.createElement("div");
      if (liveRuns.length >= 2) {
        const activeRunId = effectiveFocusedRunId(liveRuns);
        liveRuns.forEach(run => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "run-switch";
          button.dataset.key = run.__id;
          button.setAttribute("aria-current", String(run.__id === activeRunId));
          const total = run.tasks.length;
          const done = Math.min(total, Math.max(0, run.done));
          button.setAttribute("aria-label", `${run.run_name}, live, ${done} of ${total} tasks done`);
          button.addEventListener("click", () => focusRun(run.__id));

          const dot = document.createElement("span");
          dot.className = "live-dot live";
          dot.setAttribute("aria-hidden", "true");
          const name = document.createElement("span");
          name.className = "run-switch-name";
          const project = projectInfo(run);
          name.textContent = `${project.name} / ${run.run_name}`;
          name.title = project.path;
          button.setAttribute("aria-label", `${project.name}, ${run.run_name}, live, ${done} of ${total} tasks done`);
          const progress = document.createElement("span");
          progress.className = "run-switch-progress mono";

    function focusRun(runIdValue, scrollToRun = true) {
      const run = state.runs.find(item => item.__id === runIdValue);
      if (!run) return;
      state.view = "single";
      state.focusedRunId = run.__id;
      state.artifactName = run.run_name;
      state.artifactManual = true;
      state.artifactVersion = "live";
      state.frameKey = "";
      state.runOpen[run.__id] = true;
      sessionStorage.setItem(ARTIFACT_KEY, run.run_name);
      replaceUrlState();
      renderViewControls();
      renderRunningNow();
      renderArtifacts();
      renderArtifactControls();
      if (state.shellView === "artifacts") renderArtifactsView();
      renderLive();
      loadArtifactFrame(true);
      if (!scrollToRun) return;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const target = [...els.runs.querySelectorAll("details.run")]
          .find(section => section.dataset.key === run.__id);
        if (!target) return;
        target.open = true;
        state.runOpen[run.__id] = true;

          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "start"

    function renderPilotReview(run) {
      const pilot = run.pilot;
      const pilotTask = String(pilot.task || "unknown");
      const task = run.tasks.find((item, index) => taskKey(item, index) === pilotTask) || null;
      const heldCount = run.tasks.filter((task, index) => taskKey(task, index) !== pilotTask).length;
      const since = parseTime(pilot.since);
      const waitedSeconds = since ? Math.max(0, (Date.now() - since) / 1000) : 0;
      const waiting = since ? (waitedSeconds < 1 ? "0s" : formatDuration(waitedSeconds)) : "unknown";
      const waitLimit = numberOrZero(pilot.wait_s) || 1800;
      const timedOut = waitedSeconds >= waitLimit;
      const revisions = Math.max(0, Math.floor(numberOrZero(pilot.revisions)));
      let decisionState = state.pilotDecisions.get(run.__id) || {};
      if (decisionState.result === "revise" && revisions > numberOrZero(decisionState.revisions)) {
        state.pilotDecisions.delete(run.__id);
        decisionState = {};
      }
      const inFlight = Boolean(decisionState.inFlight);
      const recorded = Boolean(decisionState.result);
      const abandoned = run.orchestrator_alive === false;

      const block = document.createElement("section");
      block.className = `pilot-review${abandoned ? " abandoned" : ""}`;
      block.dataset.key = `pilot-review:${run.__id}`;
      block.setAttribute("aria-label", abandoned ? "Pilot review abandoned" : "Pilot decision required");

      const main = document.createElement("div");
      main.className = "pilot-review-main";

      const head = document.createElement("div");
      head.className = "pilot-review-head";
      const title = document.createElement("span");
      title.className = "pilot-review-title";
      title.textContent = abandoned ? "Pilot review abandoned" : "Paused for pilot review";
      const facts = document.createElement("span");
      facts.className = "pilot-review-facts mono";
      facts.textContent = abandoned
        ? `Pilot ${pilotTask} · revision ${revisions} · orchestrator exited`
        : `Pilot ${pilotTask} · revision ${revisions} · waiting ${waiting} of ${formatDuration(waitLimit)}`;
      head.append(title, facts);
      main.appendChild(head);

      const copy = document.createElement("p");
      copy.className = "pilot-review-copy";
      copy.textContent = abandoned
        ? "The run's orchestrator exited and the decision can no longer be delivered."
        : `Review the pilot deliverable and evidence, then clear this item. ${heldCount} lane${heldCount === 1 ? " is" : "s are"} held.`;
      main.appendChild(copy);

      const evidence = document.createElement("div");
      evidence.className = "pilot-evidence";
      const evidenceItem = (labelText, valueText, className = "") => {
        const item = document.createElement("div");
        item.className = "pilot-evidence-item";
        const label = document.createElement("span");
        label.className = "pilot-evidence-label";
        label.textContent = labelText;
        const value = document.createElement("span");
        value.className = `pilot-evidence-value${className ? ` ${className}` : ""}`;
        value.textContent = valueText;
        item.append(label, value);
        return item;
      };
      evidence.append(
        evidenceItem("Deliverable", pilotTask),
        evidenceItem("Check", task ? `${taskStateText(taskKind(task))} · ${String(task.check || "No check recorded")}` : "Pilot task not found", task && taskKind(task) === "pass" ? "pass" : ""),
        evidenceItem("Latest evidence", task ? (taskActivity(task) || String(task.output || task.result || "No evidence summary recorded")) : "No evidence recorded")
      );
      const lastNote = String(pilot.last_note || "").trim();
      if (lastNote) {
        const note = evidenceItem("Previous request", lastNote);
        note.classList.add("pilot-last-note");
        evidence.appendChild(note);
      }
      if (timedOut) {
        const timeout = evidenceItem("Review window", `Timed out after ${formatDuration(waitLimit)}`);
        timeout.querySelector(".pilot-evidence-value").classList.add("pilot-timeout");
        evidence.appendChild(timeout);
      }
      main.appendChild(evidence);
      block.appendChild(main);

      const clear = document.createElement("aside");
      clear.className = "pilot-clear";
      clear.setAttribute("aria-label", "Clear this review item");
      const clearTitle = document.createElement("h3");
      clearTitle.className = "pilot-clear-title";
      clearTitle.textContent = "Clear this item";
      clear.appendChild(clearTitle);

      const actions = document.createElement("div");
      actions.className = "pilot-actions";
      const approve = document.createElement("button");
      approve.type = "button";
      approve.className = "approve";
      approve.textContent = inFlight && decisionState.decision === "approve" ? "Approving…" : `Approve & release ${heldCount} lane${heldCount === 1 ? "" : "s"}`;
      approve.setAttribute("aria-label", `Approve pilot task ${pilotTask} and release held lanes`);
      approve.disabled = abandoned || inFlight || recorded;
      approve.addEventListener("click", () => submitPilotDecision(run, "approve"));
      actions.appendChild(approve);

      const noteLabel = document.createElement("label");
      noteLabel.className = "pilot-note-label";
      noteLabel.htmlFor = `pilot-note-${run.__id}`;
      noteLabel.textContent = "Request changes note";
      const note = document.createElement("textarea");
      note.className = "pilot-note";
      note.id = `pilot-note-${run.__id}`;
      note.dataset.key = `pilot-note:${run.__id}`;
      note.placeholder = "What should the pilot change?";
      note.value = state.pilotNotes.get(run.__id) || "";
      note.disabled = abandoned || inFlight || recorded;
      const revise = document.createElement("button");
      revise.type = "button";
      revise.className = "revise";
      revise.textContent = inFlight && decisionState.decision === "revise" ? "Sending note…" : "Send note & re-run pilot";
      revise.setAttribute("aria-label", `Send changes note and re-run pilot task ${pilotTask}`);
      revise.disabled = abandoned || inFlight || recorded || !note.value.trim();
      note.addEventListener("input", () => {
        state.pilotNotes.set(run.__id, note.value);
        revise.disabled = abandoned || inFlight || recorded || !note.value.trim();
      });
      revise.addEventListener("click", () => submitPilotDecision(run, "revise", note.value));
      actions.append(noteLabel, note, revise);

      const reject = document.createElement("button");
      reject.type = "button";
      reject.className = "reject";
      reject.textContent = inFlight && decisionState.decision === "reject" ? "Rejecting…" : "Reject";
      reject.setAttribute("aria-label", `Reject pilot task ${pilotTask} and end the run`);
      reject.disabled = abandoned || inFlight || recorded;
      reject.addEventListener("click", () => submitPilotDecision(run, "reject"));
      actions.appendChild(reject);
      clear.appendChild(actions);

      const status = document.createElement("p");
      status.className = "pilot-decision-status";
      status.setAttribute("role", "status");
      if (abandoned) {
        status.textContent = "The orchestrator exited. A decision can no longer be delivered.";
      } else if (decisionState.result === "approve") {
        status.classList.add("approve");
        status.textContent = "Approved. Held lanes will resume.";
      } else if (decisionState.result === "reject") {
        status.classList.add("reject");
        status.textContent = "Rejected. The run will end.";
      } else if (decisionState.result === "revise") {
        status.classList.add("revise");
        status.textContent = "Changes requested. The pilot is re-running and will return to this queue.";
      } else if (inFlight) {
        status.textContent = decisionState.decision === "revise" ? "Sending note and restarting pilot…" : "Recording decision…";
      } else if (timedOut) {
        status.textContent = "The review window has elapsed; the orchestrator may time out this run.";
      } else {
        status.textContent = "Awaiting a decision.";
      }
      clear.appendChild(status);

      if (decisionState.error) {
        const error = document.createElement("p");
        error.className = "pilot-error";
        error.setAttribute("role", "alert");
        const label = document.createElement("b");
        label.textContent = "Decision not recorded:";
        error.append(label, document.createTextNode(` ${decisionState.error}`));
        clear.appendChild(error);
      }

      const cli = document.createElement("p");
      cli.className = "pilot-cli mono";
      if (abandoned) {
        cli.textContent = "Terminal approve or reject commands would not reach the orchestrator either.";
      } else {
        cli.append(
          document.createTextNode("Terminal: "),
          Object.assign(document.createElement("code"), {textContent: `./ringer.py approve ${run.__id}`}),
          document.createTextNode(" · "),
          Object.assign(document.createElement("code"), {textContent: `./ringer.py reject ${run.__id}`})
        );
      }
      clear.appendChild(cli);
      block.appendChild(clear);
      return block;
    }

    function renderPilotBanner() {
      const awaiting = state.runs
        .filter(run => run.pilot?.status === "awaiting")
        .sort((left, right) => parseTime(left.pilot?.since) - parseTime(right.pilot?.since));
      const staging = document.createElement("div");
      const shell = document.createElement("section");

      shell.dataset.key = "pilot-queue-shell";
      shell.setAttribute("aria-label", "Pilot review queue");
      const queue = document.createElement("aside");

      const queueHead = document.createElement("div");
      queueHead.className = "pilot-queue-head";
      const queueTitle = document.createElement("h2");
      queueTitle.className = "pilot-queue-title";
      queueTitle.textContent = "Review queue";

      count.className = "pilot-queue-count";

      count.textContent = String(awaiting.length);

          const name = document.createElement("span");
