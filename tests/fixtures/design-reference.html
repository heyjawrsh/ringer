<!doctype html>
<html lang="en">
<!--
  Design token reference for tests/test_design_reference.py.

  This is the frozen source of truth for ringer.py's ARTIFACT_BASE_CSS custom
  properties. test_renderer_tokens_match_design_reference asserts the two stay
  in sync, so if you change a --token value in ARTIFACT_BASE_CSS, update the
  matching block here in the same commit.
-->
<head>
<meta charset="utf-8">
<title>ringer design reference</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0e14;
    --surface: #0c1219;
    --surface-alt: #0d1319;
    --ink: #e9f0f4;
    --muted: #8998a6;
    --hairline: #19232c;
    --rule: #27323c;
    --accent: #70d7dc;
    --readout: #70d7dc;
    --pass: #4cdda0;
    --fail: #ff735f;
    --waiting: #64727f;
    --quote-bg: rgba(255, 115, 95, .07);
    --running: #70d7dc;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --gutter-w: 6px;
    --row-pad-y: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --ground: #f3f6f7;
      --surface: #ffffff;
      --surface-alt: #edf2f4;
      --ink: #172129;
      --muted: #5f6f7a;
      --hairline: #dce4e8;
      --rule: #bcc9d0;
      --accent: #087f87;
      --readout: #087f87;
      --pass: #087a50;
      --fail: #c74638;
      --waiting: #72808a;
      --quote-bg: rgba(199, 70, 56, .07);
      --running: #087f87;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b0e14; --surface: #0c1219; --surface-alt: #0d1319; --ink: #e9f0f4;
    --muted: #8998a6; --hairline: #19232c; --rule: #27323c; --accent: #70d7dc;
    --readout: #70d7dc; --pass: #4cdda0; --fail: #ff735f; --waiting: #64727f;
    --quote-bg: rgba(255,115,95,.07); --running: #70d7dc;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ground: #f3f6f7; --surface: #ffffff; --surface-alt: #edf2f4; --ink: #172129;
    --muted: #5f6f7a; --hairline: #dce4e8; --rule: #bcc9d0; --accent: #087f87;
    --readout: #087f87; --pass: #087a50; --fail: #c74638; --waiting: #72808a;
    --quote-bg: rgba(199,70,56,.07); --running: #087f87;
  }
</style>
</head>
<body></body>
</html>
